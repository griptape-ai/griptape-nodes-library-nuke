<!doctype html>
<!--
A Nuke panel, in a browser, driving a real Griptape Nodes engine over websocket_direct.

Not a list of requests with buttons on them. This is shaped like the plugin a studio would
actually ship, because the mistakes worth catching before writing C++ are the ones that only
show up when the verbs are wired into a workflow an artist would follow:

  - No Connect button. The panel comes up with the comp, finds the engine, and keeps finding
    it. Reconnecting is the normal case, not the error case, and one resync sequence serves
    both first connect and recovery.
  - Picking a workflow describes it. Loading is a second, deliberate press, because loading
    clears the engine and takes an editor user's open comp with it.
  - Knob edits write through to the engine, coalesced, so the engine holds what the panel
    shows. During a render the panel locks instead, because a value set mid-run cannot be
    told apart from one that landed too late.
  - One button, Render, that becomes Cancel. There is one execution at a time.
  - A progress bar built from the run's node set over resolved node states, plus one batched
    backstop poll, because delivery is fire and forget with no replay.
  - The last mile: what each output value would become in the DAG, as the nuke.nodes calls a
    plugin would make.

Every verb and notification in nuke_host_api/protocol.py is reached by that flow. The Studio
checks tab is the verb-by-verb suite a TD runs against a candidate engine before shipping.

The contract is nuke_host_api/INTEGRATION.md. Nothing here names an engine type. This is a
testing dashboard, not a reference client: no part of its shape is a contract.

Enable websocket_direct in the engine config first (INTEGRATION.md, "Connecting"), then open
this file in a browser. `make host-api/dashboard` does the opening.

Preact and htm are loaded as ES modules from esm.sh, pinned by the import map below, so there
is no build step. That means this page needs network access on first load to fetch those two
modules; the engine socket itself stays local. If the modules cannot be fetched the page says
so rather than rendering blank.

The transport section is the part a plugin must reimplement. The components below are only
presentation.
-->
<html lang="en">

  <body>
    <div id="app">
      <div style="padding: 20px; color: #868686">Loading modules...</div>
    </div>
    <script>
      // Preact and htm are fetched from a CDN by the module below. Without this, a machine with
      // no network access would show nothing at all and look broken rather than offline.
      window.__bootTimer = setTimeout(function () {
        var root = document.getElementById("app");
        if (!root || root.dataset.rendered) return;
        root.innerHTML =
          '<div style="padding:20px;max-width:760px;line-height:1.6">' +
          '<b style="color:#c8452f">Could not load preact and htm from esm.sh.</b>' +
          "<p>This page has no build step, so it fetches those two modules over the network on " +
          "first load. The engine connection itself is local and unaffected.</p>" +
          "<p>On a machine without internet access, serve the two modules locally and change the " +
          "import map at the top of this file to point at them.</p></div>";
      }, 8000);
    </script>
    <script type="module">
      import { h, render } from "preact";
      import { useState, useEffect, useMemo } from "preact/hooks";
      import htm from "htm";

      const html = htm.bind(h);

      /* ------------------------------------------------------- the frozen surface */
      // Everything a host may name on the wire. Nothing outside this block is a contract.

      const VERB = {
        CONNECT: "NukeConnectRequest",
        LIST_WORKFLOWS: "NukeListWorkflowsRequest",
        DESCRIBE_WORKFLOW: "NukeDescribeWorkflowRequest",
        LOAD_WORKFLOW: "NukeLoadWorkflowRequest",
        EXECUTE_WORKFLOW: "NukeExecuteWorkflowRequest",
        GET_EXECUTION_STATE: "NukeGetExecutionStateRequest",
        GET_PARAMETER_VALUES: "NukeGetParameterValuesRequest",
        SET_PARAMETER_VALUES: "NukeSetParameterValuesRequest",
        CANCEL_EXECUTION: "NukeCancelExecutionRequest",
        LIST_PROJECTS: "NukeListProjectsRequest",
        GET_CURRENT_PROJECT: "NukeGetCurrentProjectRequest",
        SET_CURRENT_PROJECT: "NukeSetCurrentProjectRequest",
        DESCRIBE_PROJECT: "NukeDescribeProjectRequest",
      };
      const NOTIFICATION = {
        NODE_STATE: "NukeNodeStateEvent",
        PARAMETER_VALUE: "NukeParameterValueEvent",
        EXECUTION_STATE: "NukeExecutionStateEvent",
        EXECUTION_NODES: "NukeExecutionNodesEvent",
      };
      const CLIENT_PROTOCOL_VERSIONS = [1];
      const TERMINAL_EXECUTION_STATES = ["completed", "failed", "cancelled"];
      const KNOWN_NODE_STATES = ["unresolved", "running", "resolved", "failed"];
      const KNOWN_VALUE_TYPES = [
        "GTImage",
        "GTMovie",
        "GTFile",
        "GTText",
        "GTNumber",
        "GTBool",
        "GTNull",
      ];
      // Types that carry no sources. The descriptor reports the type but not the scalar.
      const SCALAR_TYPES = ["GTText", "GTNumber", "GTBool", "GTNull"];
      const PREVIEWABLE = { GTImage: "img", GTMovie: "video" };
      const PARAMETER_SECTIONS = ["inputs", "outputs"];
      // GOOD and FLAWED are usable. UNUSABLE and MISSING are not.
      const USABLE_PROJECT_STATUSES = ["GOOD", "FLAWED"];

      const REPLY_TOPIC = "nuke-host-browser/reply";
      const REQUEST_TIMEOUT_MS = 60000;
      // The first request gets a shorter budget, because its usual failure is a library that is
      // not installed, and the engine answers an unhandled request type with silence.
      const CONNECT_TIMEOUT_MS = 12000;
      const DRAIN_MS = 20000;
      const DRAIN_GRACE_MS = 800;
      const FRAME_LOG_LIMIT = 500;
      const LIVE_FEED_LIMIT = 200;

      // A panel inside Nuke has no Connect button: it comes up with the comp and is expected to
      // find the engine itself. Backoff rather than a tight loop, because an artist may open Nuke
      // long before anyone starts an engine, and the panel must not spin for the whole session.
      const RECONNECT_BACKOFF_MS = [1000, 2000, 4000, 8000, 15000, 30000];
      // An artist drags a knob. One request per keystroke would be one engine round trip per
      // keystroke, so writes coalesce.
      const WRITE_THROUGH_DEBOUNCE_MS = 400;
      // Delivery is fire and forget with no replay, so a plugin cannot make a run's outcome
      // depend on having received every event. One cheap batched tick covers a dropped frame.
      const POLL_TICK_MS = 2500;

      /* ------------------------------------------------------------------- store */
      //
      // State lives here rather than in component closures, because the socket mutates it from
      // callbacks that are outside any component. Components subscribe and re-render.
      //
      // Emits are coalesced into one render per frame. Without that, a burst of ~60 parameter
      // value events in the same millisecond would trigger ~60 renders, and the old imperative
      // version needed hand-rolled dirty flags to avoid exactly that.

      const store = {
        state: {
          wsUrl: "ws://127.0.0.1:18125",
          clientName: "Nuke 16.0v7 (browser host)",
          socket: "disconnected",
          session: null,
          subscribed: { reply: false, events: false },
          autoConnect: true,
          connectAttempts: 0,
          reconnects: 0,
          nextAttemptAt: null,
          resyncSteps: [],
          writeThrough: true,
          supervisor: false,
          pollTicks: 0,
          lastPollAt: null,
          workflows: [],
          described: null,
          loaded: null,
          loadFilePath: "",
          knobs: {},
          nodeStates: [],
          inputValues: {},
          outputValues: {},
          projects: [],
          includeSystemBuiltins: false,
          currentProject: null,
          describedProject: null,
          projectNote: "",
          execution: null,
          executionNodeSets: [],
          runTotal: null,
          lastRun: null,
          lastSet: null,
          banner: null,
          pollSummary: "",
          notifications: [],
          frames: [],
          frameFilter: "",
          feed: [],
          requestsSent: 0,
          requestsDuringRun: 0,
          runActive: false,
          runOrigin: null,
          runStartedAt: null,
          lastEventAt: null,
          tab: "panel",
          checks: [],
          conformanceRunning: false,
          conformanceWorkflowId: "",
          tick: 0,
        },
        listeners: new Set(),
        scheduled: false,
      };

      function setState(patch) {
        Object.assign(store.state, patch);
        scheduleRender();
      }

      function scheduleRender() {
        if (store.scheduled) return;
        store.scheduled = true;
        requestAnimationFrame(() => {
          store.scheduled = false;
          store.listeners.forEach((listener) => listener());
        });
      }

      function useStore() {
        const [, bump] = useState(0);
        useEffect(() => {
          const listener = () => bump((n) => n + 1);
          store.listeners.add(listener);
          return () => store.listeners.delete(listener);
        }, []);
        return store.state;
      }

      const state = () => store.state;
      const paramKey = (node, parameter) => node + "." + parameter;
      const stateClass = (value, known) =>
        known.indexOf(value) === -1 ? "unknown" : value;
      const usableProject = (status) =>
        USABLE_PROJECT_STATUSES.indexOf(status) !== -1;

      // {node: {parameter: descriptor}} flattened to the "node.parameter" keys the panel
      // indexes by. Load and the bulk read verb both answer in the nested shape.
      function flattenValues(byNode, live) {
        const flat = {};
        Object.keys(byNode || {}).forEach((node) => {
          const parameters = byNode[node] || {};
          Object.keys(parameters).forEach((parameter) => {
            flat[paramKey(node, parameter)] = {
              value: parameters[parameter],
              live: Boolean(live),
            };
          });
        });
        return flat;
      }

      // A descriptor is what the engine holds; a knob needs the scalar behind it. Only the
      // scalar types carry one, and even they carry it as a type with no value, so the text
      // a knob starts with comes from the source locator when there is one.
      function knobValueFrom(descriptor) {
        if (!descriptor || typeof descriptor !== "object") return undefined;
        const sources = Array.isArray(descriptor.sources) ? descriptor.sources : [];
        const first = sources.length ? sources[0] || {} : null;
        if (first && first.kind !== "inline" && first.value) return first.value;
        return undefined;
      }

      /* --------------------------------------------------------------- transport */
      //
      // This section is the part a real plugin must reimplement. It touches no components.

      let ws = null;
      const pending = new Map();

      function logFrame(direction, frame) {
        const payload = (frame && frame.payload) || {};
        const frames = state().frames.concat([
          {
            direction,
            at: new Date(),
            type: frame && frame.type ? frame.type : payload.event_type || "?",
            what:
              payload.request_type ||
              payload.payload_type ||
              payload.result_type ||
              frame.topic ||
              "",
            requestId: payload.request_id || frame.id || "",
            frame,
          },
        ]);
        setState({
          frames:
            frames.length > FRAME_LOG_LIMIT
              ? frames.slice(frames.length - FRAME_LOG_LIMIT)
              : frames,
        });
      }

      function sendFrame(frame) {
        if (!ws || ws.readyState !== WebSocket.OPEN) {
          throw new Error("Socket is not open.");
        }
        ws.send(JSON.stringify(frame));
        logFrame("out", frame);
      }

      function subscribe(topic) {
        sendFrame({ type: "subscribe", topic });
      }

      // One request in, one reply out, correlated by request_id and never by arrival order,
      // because notifications share this socket and arrive interleaved.
      function newRequestId() {
        return Math.random().toString(16).slice(2) + Date.now().toString(16);
      }

      // Registering the reply is separate from sending the frame, because a batch registers
      // several replies and sends one frame.
      function trackReply(requestId, requestType, timeoutMs) {
        const budget = timeoutMs || REQUEST_TIMEOUT_MS;
        return new Promise((resolve, reject) => {
          const timer = setTimeout(() => {
            pending.delete(requestId);
            reject(
              new Error(
                "Timed out after " +
                  budget / 1000 +
                  "s waiting for a reply to " +
                  requestType,
              ),
            );
          }, budget);
          pending.set(requestId, { resolve, reject, timer });
        });
      }

      function countRequest() {
        setState({
          requestsSent: state().requestsSent + 1,
          requestsDuringRun: state().runActive
            ? state().requestsDuringRun + 1
            : state().requestsDuringRun,
        });
      }

      function requestEnvelope(requestType, payload, requestId) {
        return {
          event_type: "EventRequest",
          request_type: requestType,
          request: payload || {},
          request_id: requestId,
          response_topic: REPLY_TOPIC,
        };
      }

      function request(requestType, payload, timeoutMs) {
        const requestId = newRequestId();
        const waiting = trackReply(requestId, requestType, timeoutMs);
        countRequest();
        try {
          sendFrame({ payload: requestEnvelope(requestType, payload, requestId) });
        } catch (err) {
          const entry = pending.get(requestId);
          if (entry) {
            clearTimeout(entry.timer);
            pending.delete(requestId);
          }
          return Promise.reject(err);
        }
        return waiting;
      }

      // Several verbs answered in one network round trip. The engine fans the batch out into
      // ordinary requests on ingest, so each inner request keeps its own request_id and its reply
      // comes back as a normal result frame. There is no batched reply to wait for.
      //
      // EventRequestBatch belongs to the engine's own wire envelope, not to this protocol, so its
      // shape can change without a version bump. It is worth that for a poll tick, which reads
      // two verbs on a timer and would otherwise cost two frames every tick.
      function requestBatch(entries, timeoutMs) {
        const requests = [];
        const waiting = entries.map((entry) => {
          const requestId = newRequestId();
          requests.push(
            requestEnvelope(entry.requestType, entry.payload, requestId),
          );
          return trackReply(requestId, entry.requestType, timeoutMs);
        });
        countRequest();
        try {
          sendFrame({ payload: { event_type: "EventRequestBatch", requests } });
        } catch (err) {
          requests.forEach((envelope) => {
            const entry = pending.get(envelope.request_id);
            if (entry) {
              clearTimeout(entry.timer);
              pending.delete(envelope.request_id);
            }
          });
          return Promise.reject(err);
        }
        return Promise.all(waiting);
      }

      // The message pump. A client that reads until it finds its own reply, discarding the rest,
      // silently drops every notification. One handler serves the whole socket and dispatches
      // notifications while requests are still outstanding.
      function onMessage(event) {
        let frame;
        try {
          frame = JSON.parse(event.data);
        } catch {
          logFrame("in", {
            type: "unparseable",
            payload: { request_type: String(event.data).slice(0, 200) },
          });
          return;
        }
        logFrame("in", frame);
        const payload = frame.payload || {};

        if (frame.type === "pong") return;

        if (frame.type === "app_event" || payload.event_type === "AppEvent") {
          const payloadType = payload.payload_type || "";
          // Other libraries and the engine broadcast on this topic too.
          if (payloadType.indexOf("Nuke") === 0) {
            dispatchNotification(payloadType, payload.payload || {});
          }
          return;
        }

        const waiting = pending.get(payload.request_id);
        if (waiting) {
          clearTimeout(waiting.timer);
          pending.delete(payload.request_id);
          waiting.resolve(payload);
          return;
        }
        // Anything else is the engine's own traffic. Binding to it would take on the engine's
        // release cadence, which is the problem this protocol exists to avoid.
      }

      let drainWaiter = null;

      function dispatchNotification(payloadType, body) {
        const patch = {
          notifications: state().notifications.concat([
            { type: payloadType, body },
          ]),
        };

        if (payloadType === NOTIFICATION.NODE_STATE) {
          const nodeStates = state().nodeStates.slice();
          const index = nodeStates.findIndex(
            (entry) => entry.node === body.node_name,
          );
          const entry = {
            node: body.node_name,
            state: body.state,
            detail: body.detail || "",
          };
          if (index === -1) nodeStates.push(entry);
          else nodeStates[index] = entry;
          patch.nodeStates = nodeStates;
        } else if (payloadType === NOTIFICATION.PARAMETER_VALUE) {
          // The engine pushes both sides, so route by what the loaded workflow declared rather
          // than assuming every streamed value is an output.
          const key = paramKey(body.node_name, body.parameter_name);
          const declaredInput = ((state().loaded && state().loaded.inputs) || []).some(
            (param) => paramKey(param.node, param.parameter) === key,
          );
          const target = declaredInput ? "inputValues" : "outputValues";
          patch[target] = Object.assign({}, state()[target]);
          patch[target][key] = { value: body.value, live: true };
        } else if (payloadType === NOTIFICATION.EXECUTION_NODES) {
          // Not one-shot and not a participant count. The engine emits one non-empty list per
          // flow it starts, so arrival order is what tells the run's total from a subflow's.
          const involved = Array.isArray(body.involved_nodes) ? body.involved_nodes : [];
          patch.executionNodeSets = state().executionNodeSets.concat([involved]);
          if (involved.length && state().runTotal === null) {
            patch.runTotal = involved;
          }
        } else if (payloadType === NOTIFICATION.EXECUTION_STATE) {
          patch.execution = body;
          if (TERMINAL_EXECUTION_STATES.indexOf(body.state) !== -1) {
            patch.runActive = false;
            // Outputs are not on the terminal event and never will be. A plugin reads them once,
            // here, which is the same call it makes after a reconnect. One code path.
            stopPolling();
            if (state().loaded) {
              setTimeout(() => guard(() => doReadValues(["outputs"]))(), DRAIN_GRACE_MS);
            }
          }
        }

        setState(patch);
        noteEvent(payloadType, body);

        if (
          drainWaiter &&
          payloadType === NOTIFICATION.EXECUTION_STATE &&
          TERMINAL_EXECUTION_STATES.indexOf(body.state) !== -1
        ) {
          // A grace period, because trailing parameter values follow the terminal state.
          setTimeout(() => {
            if (drainWaiter) drainWaiter();
          }, DRAIN_GRACE_MS);
        }
        // An unknown Nuke* notification is logged and ignored rather than treated as fatal.
      }

      function drain(ms) {
        return new Promise((resolve) => {
          const finish = () => {
            clearTimeout(timer);
            drainWaiter = null;
            resolve();
          };
          const timer = setTimeout(finish, ms);
          drainWaiter = finish;
        });
      }

      function succeeded(reply) {
        return reply && reply.event_type === "EventResultSuccess";
      }

      // Failure messages are written to be shown to an artist, so they are used verbatim.
      function detailOf(reply) {
        const result = (reply && reply.result) || {};
        const details = result.result_details;
        if (details && Array.isArray(details.result_details)) {
          const messages = details.result_details.map(
            (entry) => (entry && entry.message) || JSON.stringify(entry),
          );
          if (messages.length) return messages.join("; ");
        }
        if (typeof details === "string") return details;
        return "";
      }

      function banner(kind, title, text) {
        setState({ banner: { kind, title, text } });
      }

      /* ------------------------------------------------------------- live push */
      //
      // A run this page did not start is the clearest proof that notifications are pushed.
      // Origin has to be inferred from whether this page sent the run request, because the
      // protocol carries no execution id to attribute an event with.

      function noteRunActivity(startedHere) {
        if (state().runActive) return;
        setState({
          runActive: true,
          runOrigin: startedHere ? "this page" : "elsewhere",
          runStartedAt: Date.now(),
          requestsDuringRun: 0,
        });
      }

      function noteEvent(payloadType, body) {
        const now = Date.now();
        const delta = state().lastEventAt ? now - state().lastEventAt : null;
        noteRunActivity(false);

        const feed = state().feed.concat([
          {
            delta,
            type: payloadType,
            summary: summarizeEvent(payloadType, body),
            foreign: state().runOrigin === "elsewhere",
            at: now,
          },
        ]);
        setState({
          lastEventAt: now,
          feed:
            feed.length > LIVE_FEED_LIMIT
              ? feed.slice(feed.length - LIVE_FEED_LIMIT)
              : feed,
        });
      }

      function summarizeEvent(payloadType, body) {
        if (payloadType === NOTIFICATION.NODE_STATE) {
          return (
            (body.state || "?") +
            "  " +
            (body.node_name || "?") +
            (body.detail ? "  " + body.detail : "")
          );
        }
        if (payloadType === NOTIFICATION.PARAMETER_VALUE) {
          return (
            ((body.value || {}).value_type || "?") +
            "  " +
            paramKey(body.node_name, body.parameter_name)
          );
        }
        if (payloadType === NOTIFICATION.EXECUTION_STATE) {
          return (
            (body.state || "?") + "  terminal_node=" + (body.terminal_node || "-")
          );
        }
        if (payloadType === NOTIFICATION.EXECUTION_NODES) {
          const involved = Array.isArray(body.involved_nodes) ? body.involved_nodes : [];
          if (!involved.length) return "empty list, the top-level run finished";
          return involved.length + " node(s)  " + involved.join(", ");
        }
        return JSON.stringify(body).slice(0, 120);
      }

      /* --------------------------------------------------------------- connect */

      function openSocket(url) {
        return new Promise((resolve, reject) => {
          let socket;
          try {
            socket = new WebSocket(url);
          } catch (err) {
            reject(err);
            return;
          }
          socket.onopen = () => resolve(socket);
          socket.onerror = () =>
            reject(
              new Error(
                "Could not open " +
                  url +
                  ". Is the engine running with the websocket_direct driver enabled?",
              ),
            );
          socket.onclose = (event) => onSocketClosed(event);
          socket.onmessage = onMessage;
        });
      }

      function onSocketClosed(event) {
        const wasConnected = state().session !== null;
        ws = null;
        pending.forEach((entry) => clearTimeout(entry.timer));
        pending.clear();
        stopPolling();
        setState({
          socket:
            "disconnected" + (event && event.code ? " (" + event.code + ")" : ""),
          session: null,
          subscribed: { reply: false, events: false },
          runActive: false,
        });
        if (wasConnected) {
          setState({ reconnects: state().reconnects + 1 });
          banner(
            "warn",
            "Socket closed.",
            "Notifications sent while disconnected are gone. There is no buffer, backlog, or " +
              "resume cursor, so reconnecting cannot replay them. The resync sequence is what " +
              "recovers: current truth is re-read rather than assumed continuous.",
          );
        }
        scheduleReconnect();
      }

      /* -------------------------------------------------------- plugin lifecycle */
      //
      // What a panel inside Nuke owns, and the reason this page auto-connects rather than waiting
      // for a button. A plugin comes up with the comp and is expected to find the engine itself,
      // then keep finding it: an engine restart, a library reload after a project switch, or a
      // laptop waking up all arrive as a closed socket. Reconnecting is the normal case.

      let reconnectTimer = null;

      function cancelReconnect() {
        if (reconnectTimer) {
          clearTimeout(reconnectTimer);
          reconnectTimer = null;
        }
        setState({ nextAttemptAt: null });
      }

      // Backoff rather than a tight loop. An artist may open Nuke long before anyone starts an
      // engine, and a panel that retries every 100ms for a whole session is a panel a studio
      // uninstalls.
      function scheduleReconnect() {
        cancelReconnect();
        if (!state().autoConnect) return;
        const attempt = state().connectAttempts;
        const delay =
          RECONNECT_BACKOFF_MS[Math.min(attempt, RECONNECT_BACKOFF_MS.length - 1)];
        setState({ nextAttemptAt: Date.now() + delay });
        reconnectTimer = setTimeout(() => {
          reconnectTimer = null;
          setState({ nextAttemptAt: null });
          guard(doConnect)();
        }, delay);
      }

      function noteStep(label, outcome, detail) {
        setState({
          resyncSteps: state().resyncSteps.concat([
            { label, outcome, detail: detail || "" },
          ]),
        });
      }

      // One sequence, run on first connect and on every reconnect. A plugin with a separate
      // startup path and recovery path has two paths and only ever tests one of them.
      //
      // Order is load-bearing. Subscribe before requesting, or the reply is published to a topic
      // this connection is not listening on. Read the project before the workflow list, because
      // workflows are registered per workspace and a project decides the workspace.
      async function resync() {
        setState({ resyncSteps: [] });

        subscribe(REPLY_TOPIC);
        setState({ subscribed: { reply: true, events: false } });
        noteStep("subscribe to the reply topic", "ok", REPLY_TOPIC);

        let reply;
        try {
          reply = await request(
            VERB.CONNECT,
            {
              client_protocol_versions: CLIENT_PROTOCOL_VERSIONS,
              client_name: state().clientName.trim() || "browser host",
            },
            CONNECT_TIMEOUT_MS,
          );
        } catch (err) {
          // No reply is a different diagnosis from a refusal. The engine drops a request type it
          // has no handler for without answering, so silence means the verb's owner is missing.
          noteStep("negotiate a protocol version", "bad", "no reply at all");
          setState({ socket: "no reply" });
          banner(
            "bad",
            "Connected to the socket, but the connect verb was never answered.",
            err.message +
              ". The socket is open and the engine is reachable, so the likely cause is that " +
              "this library is not installed in this engine: the engine answers a request type " +
              "it has no handler for with silence rather than a failure. Confirm the library is " +
              "registered, and that it loaded in the orchestrator process rather than a worker.",
          );
          // Keep trying. A project switch reloads libraries, so the verbs this engine does not
          // answer now can appear without the engine restarting. Close first: this connection has
          // no session, and a reconnect re-subscribes from scratch anyway.
          if (ws) ws.close(4001, "handshake unanswered");
          return false;
        }

        if (!succeeded(reply)) {
          const supported =
            (reply.result && reply.result.supported_protocol_versions) || [];
          noteStep(
            "negotiate a protocol version",
            "bad",
            "library supports " + JSON.stringify(supported),
          );
          setState({ socket: "refused" });
          banner(
            "bad",
            "The library refused this protocol version.",
            detailOf(reply) + " Library supports: " + JSON.stringify(supported),
          );
          return false;
        }

        const result = reply.result || {};
        // protocol_version is the highest version both sides know. engine_version is display only
        // and a plugin must never branch on it.
        setState({
          socket: "connected",
          session: result,
          banner: null,
          connectAttempts: 0,
        });
        noteStep(
          "negotiate a protocol version",
          "ok",
          "version " +
            result.protocol_version +
            ", engine " +
            (result.engine_name || "unnamed"),
        );

        // The event topic is not derivable. Miss this and you get replies but silently no
        // notifications, which looks like a working integration with no progress reporting.
        if (result.event_topic) {
          subscribe(result.event_topic);
          setState({ subscribed: { reply: true, events: true } });
          noteStep("subscribe to the event topic", "ok", result.event_topic);
        } else {
          noteStep("subscribe to the event topic", "bad", "none reported");
        }

        await doReadCurrentProject();
        noteStep(
          "read the current project",
          state().currentProject ? "ok" : "bad",
          (state().currentProject && state().currentProject.workspace_dir) || "",
        );

        await doList();
        noteStep(
          "list workflows for that workspace",
          "ok",
          state().workflows.length + " listed",
        );

        // The part that only matters after a drop. A workflow this page had loaded may or may not
        // still be loaded: an engine restart lost it, a bare reconnect did not. Ask rather than
        // assume, and never reload to find out, because reloading discards whatever is there now.
        const held = state().loaded;
        if (held) {
          const settled = await request(VERB.GET_EXECUTION_STATE, {});
          const stillLoaded =
            succeeded(settled) &&
            (settled.result || {}).workflow_id === held.workflow_id;
          noteStep(
            "confirm the workflow is still loaded",
            stillLoaded ? "ok" : "warn",
            stillLoaded
              ? held.workflow_id +
                  ", running: " +
                  JSON.stringify((settled.result || {}).running)
              : "the engine holds " +
                  JSON.stringify((settled.result || {}).workflow_id || "") +
                  ", so the knobs on screen drove nothing and were dropped",
          );
          if (stillLoaded) {
            await doReadValues();
            noteStep(
              "re-read the values the drop lost",
              "ok",
              "notifications have no replay, so this is the only way back to current truth",
            );
          } else {
            setState({
              loaded: null,
              knobs: {},
              inputValues: {},
              outputValues: {},
            });
          }
        }

        return true;
      }

      async function doConnect() {
        cancelReconnect();
        setState({
          socket: "connecting",
          banner: null,
          connectAttempts: state().connectAttempts + 1,
        });
        try {
          ws = await openSocket(state().wsUrl.trim());
        } catch (err) {
          setState({ socket: "failed" });
          banner("bad", "Connection failed.", err.message);
          scheduleReconnect();
          return;
        }
        setState({ socket: "open" });
        await resync();
      }

      // An artist closing the panel is not a dropped socket, so this stops the retry loop too.
      function doDisconnect() {
        setState({ autoConnect: false });
        cancelReconnect();
        if (ws) ws.close(1000, "host closing");
      }

      // The recovery drill. Dropping the socket under a live run is the failure a plugin is least
      // likely to have tested and most likely to meet, so it gets a button.
      function doDropSocket() {
        if (!ws) return;
        setState({ autoConnect: true });
        ws.close(4000, "recovery drill");
      }

      /* ------------------------------------------------------------- run control */
      //
      // The three things a plugin gets wrong around a run: it lets an artist edit knobs mid-flight,
      // it trusts the event stream to be complete, and it has no way to stop.

      let pollTimer = null;

      function stopPolling() {
        if (pollTimer) {
          clearInterval(pollTimer);
          pollTimer = null;
        }
      }

      // One batched tick while a run is live. Not the progress mechanism: the events are. This is
      // the backstop for delivery that is fire and forget with no replay, and it reads execution
      // state and output values in one frame rather than one frame each.
      function startPolling() {
        stopPolling();
        pollTimer = setInterval(() => {
          if (!state().runActive || !ws) {
            stopPolling();
            return;
          }
          guard(doPollTick)();
        }, POLL_TICK_MS);
      }

      async function doPollTick() {
        const replies = await requestBatch([
          { requestType: VERB.GET_EXECUTION_STATE, payload: {} },
          { requestType: VERB.GET_PARAMETER_VALUES, payload: { sections: ["outputs"] } },
        ]);
        const [stateReply, valuesReply] = replies;
        setState({ pollTicks: state().pollTicks + 1, lastPollAt: Date.now() });

        if (succeeded(stateReply)) {
          const result = stateReply.result || {};
          // involved_nodes here is derived from the flow's declared nodes rather than from event
          // history, so it is the total that does not depend on which events arrived.
          const patch = {
            pollSummary:
              "running: " +
              result.running +
              ", active: " +
              JSON.stringify(result.active_nodes || []) +
              ", involved: " +
              (result.involved_nodes || []).length,
          };
          if (!state().runTotal && (result.involved_nodes || []).length) {
            patch.runTotal = result.involved_nodes;
          }
          if (result.running === false && state().runActive) {
            // A terminal event that never arrived would otherwise leave the panel locked forever.
            patch.runActive = false;
          }
          setState(patch);
        }
        if (succeeded(valuesReply)) {
          setState({
            outputValues: flattenValues((valuesReply.result || {}).outputs, false),
          });
        }
      }

      // A knob edit that only lives in the panel is a knob edit the engine does not have. A plugin
      // that stays live writes through, which is what the write verb is for; coalesced, because an
      // artist dragging a slider must not cost one round trip per pixel.
      const writeTimers = new Map();

      function setKnob(param, value) {
        const key = paramKey(param.node, param.parameter);
        setState({ knobs: Object.assign({}, state().knobs, { [key]: value }) });
        if (!state().writeThrough || !state().loaded) return;
        // Refused mid-run by design: the engine's scheduler decides when a node reads a parameter,
        // so a value set during a run cannot be told apart from one that landed too late.
        if (state().runActive) return;

        const existing = writeTimers.get(key);
        if (existing) clearTimeout(existing);
        writeTimers.set(
          key,
          setTimeout(() => {
            writeTimers.delete(key);
            guard(() => doSetValues([param]))();
          }, WRITE_THROUGH_DEBOUNCE_MS),
        );
      }

      /* --------------------------------------------------------------- actions */

      async function doList() {
        // runnable_only false on purpose. A plugin wants the unavailable entries too, so an artist
        // told to use a workflow that is missing gets the reason instead of an absence.
        const reply = await request(VERB.LIST_WORKFLOWS, { runnable_only: false });
        if (!succeeded(reply)) {
          banner("bad", "Listing failed.", detailOf(reply));
          return;
        }
        setState({ workflows: (reply.result && reply.result.workflows) || [] });
      }

      // Reads the registry and changes nothing, so this is what a panel calls when an artist picks
      // from the menu: show what a workflow declares before committing to the destructive load.
      async function doDescribe(workflowId) {
        const reply = await request(VERB.DESCRIBE_WORKFLOW, {
          workflow_id: workflowId,
        });
        if (!succeeded(reply)) {
          setState({ described: null });
          banner("bad", "Describe failed.", detailOf(reply));
          return;
        }
        const described = reply.result || {};
        setState({
          described,
          banner: null,
          conformanceWorkflowId:
            state().conformanceWorkflowId || described.workflow_id,
        });
      }

      // The only verb that changes which workflow is loaded, and the only one that must run
      // before execute, the value verbs, or execution state can answer for the workflow a host
      // means. Destructive: the engine clears all object state, including a graph an editor user
      // has open, so this asks first rather than doing it on a host's behalf inside a read.
      async function doLoad(payload) {
        const naming = payload.workflow_id || payload.file_path;
        const proceed = window.confirm(
          "Load " +
            naming +
            "?\n\nThe engine clears all object state to load a graph. Whatever is loaded now is " +
            "discarded, including a workflow an editor user has open on this engine.",
        );
        if (!proceed) return;

        const reply = await request(VERB.LOAD_WORKFLOW, payload);
        if (!succeeded(reply)) {
          const cleared = Boolean(reply.result && reply.result.engine_state_cleared);
          // Branch on engine_state_cleared, never on the reason text. False means the knobs on
          // screen still match what the engine holds and a retry is free.
          setState(cleared ? { loaded: null, knobs: {}, inputValues: {} } : {});
          banner(
            cleared ? "bad" : "warn",
            cleared
              ? "Load failed after the engine had already cleared itself."
              : "Load refused. Nothing changed.",
            detailOf(reply) +
              (cleared
                ? " The graph that was loaded is gone, so the knobs were dropped. Tell the " +
                  "artist before retrying: the comp they had open went with it."
                : " The loaded graph is untouched, so a retry is free."),
          );
          return;
        }

        const loaded = reply.result || {};
        // Knobs start at input_values, the graph's current values, not at a descriptor's
        // default, which is the workflow author's value and differs for any touched input.
        const knobs = {};
        (loaded.inputs || []).forEach((param) => {
          const descriptor = (loaded.input_values || {})[param.node] || {};
          const seed = knobValueFrom(descriptor[param.parameter]);
          if (seed !== undefined) knobs[paramKey(param.node, param.parameter)] = seed;
        });

        setState({
          loaded,
          described: loaded,
          knobs,
          inputValues: flattenValues(loaded.input_values, false),
          outputValues: flattenValues(loaded.output_values, false),
          nodeStates: [],
          execution: null,
          executionNodeSets: [],
          runTotal: null,
          conformanceWorkflowId: loaded.workflow_id,
          banner: null,
        });

        const unavailable = loaded.unavailable || [];
        if (unavailable.length) {
          banner(
            "warn",
            unavailable.length + " declared parameter(s) could not be read.",
            unavailable
              .map(
                (entry) =>
                  entry.section +
                  " " +
                  paramKey(entry.node, entry.parameter) +
                  ": " +
                  entry.reason,
              )
              .join(" | ") +
              ". Reported rather than omitted: unset and unreadable mean different things to a " +
              "host building a knob.",
          );
        }
      }

      // Inputs are addressed as {node: {parameter: value}}, using the node and parameter the
      // declaration reported. Knob values live in state, so this reads state rather than the DOM.
      // A subset is passed when writing through a single edited knob, rather than resending every
      // knob on every keystroke.
      function collectInputs(subset) {
        const inputs = {};
        const declared = subset || (state().loaded && state().loaded.inputs) || [];
        declared.forEach((param) => {
          const raw = state().knobs[paramKey(param.node, param.parameter)];
          if (raw === undefined || raw === "") return;
          let value = raw;
          if (param.type === "GTNumber") {
            value = Number(raw);
            if (Number.isNaN(value)) return;
          }
          if (!inputs[param.node]) inputs[param.node] = {};
          inputs[param.node][param.parameter] = value;
        });
        return inputs;
      }

      // A rejection is not a failure of the request, and it is the worst failure mode in the
      // protocol: the engine keeps whatever value it already had, so the run produces plausible
      // output computed from an input the artist never set.
      function reportRejections(title, result, ranAnyway) {
        const rejected = (result && result.rejected_inputs) || [];
        if (!rejected.length) return false;
        banner(
          "bad",
          rejected.length + " input(s) were rejected. " + title,
          rejected
            .map(
              (entry) =>
                paramKey(entry.node, entry.parameter) + ": " + (entry.reason || "?"),
            )
            .join(" | ") +
            (ranAnyway
              ? ". The workflow still ran, using whatever values were already on those " +
                "parameters, so its output looks plausible but was computed from the wrong input."
              : ". Everything else was applied."),
        );
        return true;
      }

      async function doRun() {
        if (!state().loaded || state().runActive) return;
        setState({
          nodeStates: [],
          execution: null,
          executionNodeSets: [],
          runTotal: null,
          runActive: false,
        });
        noteRunActivity(true);

        // Sending the loaded id costs nothing and turns a graph swapped out from under this panel,
        // by an editor user or another tool, into a refusal instead of a run of the wrong thing.
        const reply = await request(VERB.EXECUTE_WORKFLOW, {
          workflow_id: state().loaded.workflow_id,
          inputs: collectInputs(),
        });
        setState({ lastRun: reply.result || {} });

        if (!succeeded(reply)) {
          setState({ runActive: false });
          banner("bad", "Run refused.", detailOf(reply));
          return;
        }

        startPolling();

        const result = reply.result || {};
        if (reportRejections("The run started anyway.", result, true)) return;
        banner(
          "info",
          "Running.",
          "state: " +
            (result.state || "?") +
            ", " +
            (result.applied_inputs || []).length +
            " input(s) applied, none rejected.",
        );
      }

      // The write half of the bulk read verb: keep the engine holding what the panel shows, rather
      // than diverging locally until the next run.
      async function doSetValues(subset) {
        const inputs = collectInputs(subset);
        const reply = await request(VERB.SET_PARAMETER_VALUES, { inputs });
        setState({ lastSet: reply.result || {} });
        if (!succeeded(reply)) {
          banner("warn", "Nothing was set.", detailOf(reply));
          return;
        }
        const result = reply.result || {};
        if (reportRejections("Applied without running.", result, false)) return;
        // A write-through of one knob is not worth a banner; a deliberate apply of everything is.
        if (!subset) {
          banner(
            "info",
            (result.applied_inputs || []).length + " value(s) applied to the loaded graph.",
            "No run started. Read them back to confirm the engine holds them.",
          );
        }
        await doReadValues();
      }

      async function doCancel() {
        const reply = await request(VERB.CANCEL_EXECUTION, {});
        if (succeeded(reply)) {
          // The reply is not confirmation that execution stopped. The terminal state arrives as
          // a notification with state "cancelled".
          banner(
            "warn",
            "Cancel accepted.",
            "Not confirmation that execution stopped. Wait for the terminal notification.",
          );
        } else {
          banner("warn", "Cancel refused.", detailOf(reply));
        }
      }

      // The recovery path for values: what a plugin reads after a run, and after a reconnect that
      // missed every notification. Loaded-state-addressed, so it names no workflow. Which sections
      // to read is decided by the calling path, never by a control an artist sees.
      async function doReadValues(sections) {
        const reply = await request(VERB.GET_PARAMETER_VALUES, {
          sections: sections || [],
        });
        if (!succeeded(reply)) {
          setState({ pollSummary: "value read failed: " + detailOf(reply) });
          return;
        }
        const result = reply.result || {};
        const read = result.requested_sections || [];
        const patch = {
          pollSummary:
            "read " +
            JSON.stringify(read) +
            " for " +
            (result.workflow_id || "-") +
            (result.unavailable && result.unavailable.length
              ? ", " + result.unavailable.length + " unavailable"
              : ""),
        };
        // requested_sections is how a host tells "not asked for" from "asked for, got nothing",
        // so a section that was not read keeps whatever was on screen.
        if (read.indexOf("inputs") !== -1) {
          patch.inputValues = flattenValues(result.inputs, false);
        }
        if (read.indexOf("outputs") !== -1) {
          patch.outputValues = flattenValues(result.outputs, false);
        }
        setState(patch);
      }

      /* -------------------------------------------------------------- projects */

      async function doListProjects() {
        const reply = await request(VERB.LIST_PROJECTS, {
          include_system_builtins: state().includeSystemBuiltins,
        });
        if (!succeeded(reply)) {
          setState({ projectNote: "listing failed: " + detailOf(reply) });
          return;
        }
        setState({
          projects: (reply.result && reply.result.projects) || [],
          projectNote: "",
        });
      }

      async function doReadCurrentProject() {
        const reply = await request(VERB.GET_CURRENT_PROJECT, {});
        if (!succeeded(reply)) {
          // A failure here means no current project at all, which the engine treats as
          // different from being on the system defaults.
          setState({
            currentProject: null,
            projectNote: "no current project: " + detailOf(reply),
          });
          return;
        }
        setState({ currentProject: reply.result || {}, projectNote: "" });
      }

      async function doDescribeProject(projectId) {
        const reply = await request(VERB.DESCRIBE_PROJECT, {
          project_id: projectId,
        });
        if (!succeeded(reply)) {
          setState({
            describedProject: null,
            projectNote: "describe failed: " + detailOf(reply),
          });
          return;
        }
        setState({ describedProject: reply.result || {}, projectNote: "" });
      }

      // Kept off the conformance run on purpose. A switch reloads every library, this one
      // included, so it tears down the handlers and the event bridge mid-suite.
      async function doSetProject(projectId) {
        const proceed = window.confirm(
          "Switch to " +
            (projectId === null ? "the system defaults" : projectId) +
            "?\n\nThe engine may re-register every workflow and reload every library, this one " +
            "included. This page reconnects afterwards, and every workflow id and parameter it " +
            "cached is dropped.",
        );
        if (!proceed) return;

        const reply = await request(VERB.SET_CURRENT_PROJECT, {
          project_id: projectId,
        });
        if (!succeeded(reply)) {
          banner("warn", "Project switch refused.", detailOf(reply));
          return;
        }
        const result = reply.result || {};
        // Always reconnect, whatever workspace_changed says. The engine reloads libraries on a
        // decision it exposes no field for, and a reload silently stops every notification.
        setState({
          workflows: [],
          described: null,
          loaded: null,
          knobs: {},
          inputValues: {},
          outputValues: {},
          describedProject: null,
        });
        banner(
          "warn",
          "Switched to " + (result.project_id || "?") + ".",
          "workspace_changed: " +
            result.workspace_changed +
            ". Reconnecting regardless, because the engine reloads libraries on a decision it " +
            "reports no field for, and a reload stops every notification without an error.",
        );
        doDisconnect();
      }

      function guard(fn) {
        return async () => {
          try {
            await fn();
          } catch (err) {
            banner(
              "bad",
              "Request failed.",
              String(err && err.message ? err.message : err),
            );
          }
        };
      }

      /* ------------------------------------------------------------ conformance */

      function reportCheck(label, passed, meta, extra) {
        setState({
          checks: state().checks.concat([{ label, passed, meta, extra }]),
        });
        return passed;
      }

      function reportReply(label, reply, expectFailure) {
        const passed = succeeded(reply) !== Boolean(expectFailure);
        const noise = [
          "result_type",
          "result_details",
          "altered_workflow_state",
          "exception",
          "traceback",
        ];
        const body = reply.result || {};
        const visible = {};
        Object.keys(body).forEach((key) => {
          if (noise.indexOf(key) === -1) visible[key] = body[key];
        });
        return reportCheck(
          label,
          passed,
          "result_type: " +
            (reply.result_type || "?") +
            "  |  " +
            detailOf(reply).slice(0, 200),
          Object.keys(visible).length
            ? JSON.stringify(visible).slice(0, 400)
            : "",
        );
      }

      async function runConformance() {
        setState({ conformanceRunning: true, checks: [] });

        try {
          // Negotiation, in both directions, plus the additive-change rule.
          const connected = await request(VERB.CONNECT, {
            client_protocol_versions: CLIENT_PROTOCOL_VERSIONS,
            client_name: "conformance",
          });
          reportReply(
            "connect: negotiate protocol and receive the event topic",
            connected,
          );
          const session = connected.result || {};
          const valueTypes = session.value_types || [];

          reportReply(
            "connect: unsupported protocol version is refused",
            await request(VERB.CONNECT, { client_protocol_versions: [99] }),
            true,
          );

          // Additive change safety. A field from a future version must be ignored.
          reportReply(
            "connect: unknown request field is ignored",
            await request(VERB.CONNECT, {
              client_protocol_versions: CLIENT_PROTOCOL_VERSIONS,
              field_from_a_future_version: "ignore me",
            }),
          );

          // Identity comes off this reply, not off the result envelope, which promises nothing.
          reportCheck(
            "connect: engine identity is on the result, not the envelope",
            typeof session.engine_id === "string" &&
              typeof session.session_id === "string" &&
              typeof session.engine_name === "string",
            "engine_id: " +
              JSON.stringify(session.engine_id) +
              "  engine_name: " +
              JSON.stringify(session.engine_name) +
              "  session_id: " +
              JSON.stringify(session.session_id),
            "Empty is a pass. The fields must be present; the engine may have none to report.",
          );

          // Projects. The switch verb is exercised by hand on the Projects tab instead: it
          // reloads every library, this one included, so it would tear the suite down mid-run.
          const projects = await request(VERB.LIST_PROJECTS, {
            include_system_builtins: false,
          });
          reportReply("projects: list what the engine has loaded", projects);

          const current = await request(VERB.GET_CURRENT_PROJECT, {});
          reportReply("projects: read the current project", current);
          reportCheck(
            "projects: current project reports a live workspace directory",
            succeeded(current) && Boolean((current.result || {}).workspace_dir),
            "workspace_dir: " +
              JSON.stringify((current.result || {}).workspace_dir || "") +
              "  validation_status: " +
              JSON.stringify((current.result || {}).validation_status || ""),
            "Never empty, including on the system defaults project, because it is read live " +
              "rather than resolved from the project's id.",
          );

          const projectId = (current.result || {}).id;
          if (projectId) {
            reportReply(
              "projects: describe one without switching to it",
              await request(VERB.DESCRIBE_PROJECT, { project_id: projectId }),
            );
          } else {
            reportCheck(
              "projects: describe one without switching to it",
              false,
              "no current project id to describe",
            );
          }

          reportReply(
            "projects: unknown project id fails cleanly",
            await request(VERB.DESCRIBE_PROJECT, { project_id: "does-not-exist" }),
            true,
          );

          // Workflow discovery, which reads the registry and needs nothing loaded.
          reportReply(
            "discover: list runnable workflows",
            await request(VERB.LIST_WORKFLOWS, { runnable_only: true }),
          );

          const chosenId = state().conformanceWorkflowId;
          if (chosenId) {
            reportReply(
              "discover: describe declared parameters as host types",
              await request(VERB.DESCRIBE_WORKFLOW, { workflow_id: chosenId }),
            );
          } else {
            reportCheck(
              "discover: describe declared parameters as host types",
              false,
              "no workflow chosen",
              "Choose the workflow to exercise in the dropdown above.",
            );
          }

          reportReply(
            "discover: unknown workflow id fails cleanly",
            await request(VERB.DESCRIBE_WORKFLOW, {
              workflow_id: "does-not-exist",
            }),
            true,
          );

          // Loading. Both selectors and neither are refused rather than resolved, because they
          // can name different workflows. Checked before the real load, so nothing is disturbed.
          reportReply(
            "load: naming both a workflow_id and a file_path is refused",
            await request(VERB.LOAD_WORKFLOW, {
              workflow_id: chosenId || "anything",
              file_path: "/tmp/not-a-workflow.py",
            }),
            true,
          );
          reportReply(
            "load: naming neither is refused",
            await request(VERB.LOAD_WORKFLOW, {}),
            true,
          );
          reportReply(
            "load: an unregistered id is refused with nothing cleared",
            await request(VERB.LOAD_WORKFLOW, { workflow_id: "does-not-exist" }),
            true,
          );

          // Everything below needs a loaded graph. Missing a target fails rather than skipping,
          // because dropping these silently leaves the page green with the run path untested.
          let loaded = null;
          if (!chosenId) {
            reportCheck(
              "load, values, run and listen: no workflow to exercise",
              false,
              "the rest of the suite could not run",
              "Either nothing runnable is registered, or no workflow was chosen. A runnable " +
                "workflow needs a Start Flow and End Flow pair and a file still on disk.",
            );
          } else {
            const loadReply = await request(VERB.LOAD_WORKFLOW, {
              workflow_id: chosenId,
            });
            if (reportReply("load: put the chosen workflow in the engine", loadReply)) {
              loaded = loadReply.result || {};
            }
          }

          if (loaded) {
            // Load answers the declaration and the value question in one reply, in the exact
            // shapes describe and the bulk read verb answer them in.
            reportCheck(
              "load: declarations and current values arrive together",
              Array.isArray(loaded.inputs) &&
                Array.isArray(loaded.outputs) &&
                typeof loaded.input_values === "object" &&
                typeof loaded.output_values === "object" &&
                Array.isArray(loaded.unavailable),
              (loaded.inputs || []).length +
                " input(s), " +
                (loaded.outputs || []).length +
                " output(s), " +
                Object.keys(loaded.input_values || {}).length +
                " node(s) of input values, " +
                (loaded.unavailable || []).length +
                " unavailable",
              "Initialize knobs from input_values, not from a descriptor's default: default is " +
                "the author's value, input_values is what the graph holds.",
            );

            const declaredTypes = (loaded.inputs || [])
              .concat(loaded.outputs || [])
              .map((param) => param.type);
            const strayTypes = declaredTypes.filter(
              (type) => KNOWN_VALUE_TYPES.indexOf(type) === -1,
            );
            reportCheck(
              "load: every declared type is in the closed set",
              strayTypes.length === 0,
              declaredTypes.length +
                " declared type(s), " +
                strayTypes.length +
                " outside the closed set",
              strayTypes.length ? "ESCAPED: " + strayTypes.join(", ") : "",
            );

            const metadataComplete = (loaded.inputs || [])
              .concat(loaded.outputs || [])
              .every(
                (param) =>
                  param.default !== undefined &&
                  typeof param.tooltip === "string" &&
                  typeof param.settable === "boolean",
              );
            reportCheck(
              "load: every descriptor carries default, tooltip and settable",
              metadataComplete,
              "a parameter the engine gave no metadata for reports GTNull, an empty tooltip, " +
                "and settable true rather than omitting keys",
            );

            // Values, both sides and one side. requested_sections is how a host tells
            // "not asked for" from "asked for, got nothing".
            const bothSides = await request(VERB.GET_PARAMETER_VALUES, {
              sections: [],
            });
            reportReply("values: empty sections reads both sides", bothSides);
            const bothRead = (bothSides.result || {}).requested_sections || [];
            reportCheck(
              "values: empty sections is reported back as both",
              PARAMETER_SECTIONS.every((name) => bothRead.indexOf(name) !== -1),
              "requested_sections: " + JSON.stringify(bothRead),
            );

            const inputsOnly = await request(VERB.GET_PARAMETER_VALUES, {
              sections: ["inputs"],
            });
            reportCheck(
              "values: one section reads only that section",
              succeeded(inputsOnly) &&
                JSON.stringify(
                  ((inputsOnly.result || {}).requested_sections || []).slice().sort(),
                ) === JSON.stringify(["inputs"]) &&
                Object.keys((inputsOnly.result || {}).outputs || {}).length === 0,
              "requested_sections: " +
                JSON.stringify((inputsOnly.result || {}).requested_sections || []),
              detailOf(inputsOnly),
            );

            reportReply(
              "values: an unrecognized section name is refused, not ignored",
              await request(VERB.GET_PARAMETER_VALUES, { sections: ["sideways"] }),
              true,
            );

            // Writing values without running. An empty request is refused rather than answered
            // as a trivial success, because setting nothing is not what this verb is for.
            reportReply(
              "set values: a request with no pair to act on is refused",
              await request(VERB.SET_PARAMETER_VALUES, { inputs: {} }),
              true,
            );

            const textInput = (loaded.inputs || []).find(
              (param) => param.type === "GTText" && param.settable,
            );
            if (textInput) {
              const marker = "set by the browser host at " + new Date().toISOString();
              const setReply = await request(VERB.SET_PARAMETER_VALUES, {
                inputs: { [textInput.node]: { [textInput.parameter]: marker } },
              });
              reportReply("set values: apply one declared input", setReply);

              const readBack = await request(VERB.GET_PARAMETER_VALUES, {
                sections: ["inputs"],
              });
              const descriptor =
                (((readBack.result || {}).inputs || {})[textInput.node] || {})[
                  textInput.parameter
                ] || {};
              // The descriptor reports the type, not the scalar, so a text value read back is a
              // sourceless GTText. That it is GTText at all is what confirms the write landed.
              reportCheck(
                "set values: the engine holds what was set",
                succeeded(readBack) && descriptor.value_type === "GTText",
                paramKey(textInput.node, textInput.parameter) +
                  " reads back as " +
                  JSON.stringify(descriptor.value_type),
                "A scalar descriptor carries the type and no value, so this confirms the write " +
                  "was accepted rather than echoing the string.",
              );
            } else {
              reportCheck(
                "set values: apply one declared input",
                false,
                "this workflow declares no settable GTText input",
                "Pick a workflow with a text input to exercise the write path.",
              );
            }

            reportCheck(
              "set values: an undeclared pair is rejected, not failed",
              await (async () => {
                const reply = await request(VERB.SET_PARAMETER_VALUES, {
                  inputs: { "No Such Node": { nope: 1 } },
                });
                const rejected = (reply.result || {}).rejected_inputs || [];
                return succeeded(reply) && rejected.length === 1;
              })(),
              "a pair outside the declared allow-list comes back in rejected_inputs while the " +
                "request itself succeeds",
            );

            // Execute selects nothing. An id naming anything other than the loaded workflow is
            // refused rather than loaded, or the verb would be destructive.
            reportReply(
              "run: a workflow_id other than the loaded one is refused",
              await request(VERB.EXECUTE_WORKFLOW, {
                workflow_id: "does-not-exist",
                inputs: {},
              }),
              true,
            );

            const inputs = {};
            (loaded.inputs || []).forEach((param) => {
              if (param.type !== "GTText" || !param.settable) return;
              if (!inputs[param.node]) inputs[param.node] = {};
              inputs[param.node][param.parameter] = "nuke api smoke test";
            });

            const before = state().notifications.length;
            const started = await request(VERB.EXECUTE_WORKFLOW, {
              workflow_id: loaded.workflow_id,
              inputs,
            });
            const runStarted = reportReply(
              "run: start the loaded workflow with inputs",
              started,
            );
            reportCheck(
              "run: no input was silently dropped",
              runStarted && ((started.result || {}).rejected_inputs || []).length === 0,
              JSON.stringify((started.result || {}).rejected_inputs || []),
              "A rejection does not fail the run. The engine keeps the value it already had, so " +
                "the output looks plausible and was computed from the wrong input.",
            );

            if (runStarted) {
              // Not one request is sent during the drain, so a pass cannot be explained by polling.
              await drain(DRAIN_MS);
              const fresh = state().notifications.slice(before);
              const nodeEvents = fresh.filter(
                (n) => n.type === NOTIFICATION.NODE_STATE,
              );
              const valueEvents = fresh.filter(
                (n) => n.type === NOTIFICATION.PARAMETER_VALUE,
              );
              const nodeSetEvents = fresh.filter(
                (n) => n.type === NOTIFICATION.EXECUTION_NODES,
              );
              const executionEvents = fresh.filter(
                (n) => n.type === NOTIFICATION.EXECUTION_STATE,
              );

              reportCheck(
                "listen: node state events arrive unsolicited",
                nodeEvents.length > 0,
                nodeEvents.length + " received, no request was sent",
                nodeEvents
                  .slice(0, 5)
                  .map((n) => n.body.state + " " + n.body.node_name)
                  .join(" | "),
              );

              const escaped = valueEvents.filter(
                (n) =>
                  valueTypes.indexOf((n.body.value || {}).value_type) === -1,
              );
              reportCheck(
                "listen: parameter value events arrive normalized",
                valueEvents.length > 0 && escaped.length === 0,
                valueEvents.length +
                  " received, " +
                  escaped.length +
                  " outside the closed type set",
                escaped.length
                  ? "ESCAPED: " +
                      escaped
                        .map((n) => (n.body.value || {}).value_type)
                        .join(", ")
                  : valueEvents
                      .slice(0, 5)
                      .map(
                        (n) =>
                          (n.body.value || {}).value_type +
                          " " +
                          paramKey(n.body.node_name, n.body.parameter_name),
                      )
                      .join(" | "),
              );

              // The progress bar's denominator. Read by arrival order: the first non-empty list
              // is the run's total, later non-empty lists are subflows, and the empty one means
              // the top-level run finished rather than "zero nodes ran".
              const nodeSets = nodeSetEvents.map((n) =>
                Array.isArray(n.body.involved_nodes) ? n.body.involved_nodes : [],
              );
              const firstTotal = nodeSets.find((set) => set.length > 0);
              reportCheck(
                "listen: the run's node set arrives as a total",
                Boolean(firstTotal),
                nodeSets.length +
                  " list(s): " +
                  nodeSets.map((set) => set.length).join(", ") +
                  (firstTotal ? "  total: " + JSON.stringify(firstTotal) : ""),
                "A flow whose start node is also its end node emits no non-empty list at all, " +
                  "so a plugin must tolerate a run it gets no total for. This check fails on that " +
                  "workflow; pick one with more than one node.",
              );
              reportCheck(
                "listen: the empty list terminates rather than corrects the total",
                nodeSets.some((set) => set.length === 0),
                nodeSets.length
                  ? "last list had " + nodeSets[nodeSets.length - 1].length + " node(s)"
                  : "no node set events received",
              );

              reportCheck(
                "listen: terminal execution event",
                executionEvents.length > 0,
                executionEvents
                  .map(
                    (n) =>
                      n.body.state +
                      " terminal_node=" +
                      JSON.stringify(n.body.terminal_node),
                  )
                  .join(" | "),
                "completed reports only that the engine finished the flow, never that it " +
                  "succeeded. An actual failure shows up only as a live node state event.",
              );

              // Recovery: what a host does after reconnecting having missed every event.
              const recovered = await request(VERB.GET_PARAMETER_VALUES, {
                sections: ["outputs"],
              });
              const returned = Object.keys(
                (recovered.result && recovered.result.outputs) || {},
              );
              const promised = Array.from(
                new Set((loaded.outputs || []).map((param) => param.node)),
              );
              reportCheck(
                "recover: read declared outputs with no events",
                succeeded(recovered) &&
                  promised.every((node) => returned.indexOf(node) !== -1),
                "promised: " +
                  JSON.stringify(promised.sort()) +
                  "  returned: " +
                  JSON.stringify(returned.sort()),
                succeeded(recovered) ? "" : detailOf(recovered),
              );

              const settled = await request(VERB.GET_EXECUTION_STATE, {});
              reportCheck(
                "recover: execution state is the authority on whether a run may start",
                succeeded(settled) && (settled.result || {}).running === false,
                "running: " +
                  JSON.stringify((settled.result || {}).running) +
                  "  involved: " +
                  ((settled.result || {}).involved_nodes || []).length +
                  "  workflow: " +
                  JSON.stringify((settled.result || {}).workflow_id),
                "involved_nodes here is derived from the flow's declared nodes, not from event " +
                  "history, so it is the total that does not depend on arrival order.",
              );
            }
          }

          // Cancelling nothing is a failure, which is correct rather than a silent no-op.
          reportReply(
            "cancel: refused cleanly when nothing is running",
            await request(VERB.CANCEL_EXECUTION, {}),
            true,
          );
        } catch (err) {
          reportCheck(
            "conformance run aborted",
            false,
            String(err && err.message ? err.message : err),
          );
        }

        setState({ conformanceRunning: false });
      }

      /* ----------------------------------------------- value descriptor components */

      function Preview({ valueType, url }) {
        const [failed, setFailed] = useState(false);
        const tag = PREVIEWABLE[valueType];
        if (!tag || !url) return null;
        if (failed) {
          return html`<div class="muted">
            Preview failed. The engine can reach this URL; this browser cannot.
          </div>`;
        }
        // A URL the engine can reach is not necessarily one this browser can reach.
        if (tag === "video") {
          return html`<video src=${url} controls onError=${() => setFailed(true)}></video>`;
        }
        return html`<img src=${url} onError=${() => setFailed(true)} />`;
      }

      // What a real host does with a path: hand it to a Read node. is_pattern paths are correct
      // for a file knob and invalid for a direct open, so nothing here tries to load them.
      function ReadNodeRow({ source }) {
        return html`
          <div>
            <div class="stack">
              <span class="muted">Read1.file</span>
              <span class="path">${source.value || ""}</span>
              <button
                onClick=${() =>
                  navigator.clipboard &&
                  navigator.clipboard.writeText(source.value || "")}
              >
                Copy
              </button>
            </div>
            <div class="muted">
              ${source.is_pattern
                ? "Frame padding. Valid for a Read node's file knob, invalid for a direct file open."
                : "A local filesystem path. A browser cannot open it; Nuke feeds it straight to a Read node."}
            </div>
          </div>
        `;
      }

      function Source({ valueType, source }) {
        const kind = source.kind || "?";
        return html`
          <div class="src">
            <div class="stack">
              <span class="badge">${kind}</span>
              <!-- format is reported only when known, never guessed. -->
              <span class="muted">format: ${source.format || "unknown"}</span>
              ${source.width && source.height
                ? html`<span class="muted">${source.width}x${source.height}</span>`
                : null}
              ${source.byte_count
                ? html`<span class="muted">${source.byte_count} bytes</span>`
                : null}
              ${source.is_pattern
                ? html`<span class="badge warn">SEQUENCE ####</span>`
                : null}
            </div>

            ${kind === "url"
              ? html`
                  <a class="path" href=${source.value || "#"} target="_blank" rel="noreferrer">
                    ${source.value || ""}
                  </a>
                  ${source.is_pattern
                    ? null
                    : html`<${Preview} valueType=${valueType} url=${source.value} />`}
                `
              : null}
            ${kind === "path" ? html`<${ReadNodeRow} source=${source} />` : null}
            ${kind === "inline"
              ? html`<div class="muted">
                  Bytes stayed in the engine and are not in the payload. Read the same value in
                  its url or path form, or treat it as unavailable.
                </div>`
              : null}
            ${kind === "macro"
              ? html`
                  <!-- Not a path. Opening it turns a config error into a mysterious file error. -->
                  <span class="badge bad">UNRESOLVED MACRO</span>
                  <div class="path">${source.value || source.raw || ""}</div>
                  <div class="muted">
                    A template that never resolved, usually a workflow variable that was never
                    substituted. Show it as a configuration error. Do not open it.
                  </div>
                `
              : null}
            ${["url", "path", "inline", "macro"].indexOf(kind) === -1
              ? html`<div class="muted">
                  Unrecognized source kind, left alone. Raw: ${JSON.stringify(source.value)}
                </div>`
              : null}
            ${source.raw && source.raw !== source.value
              ? html`<div class="diag">raw: ${source.raw}</div>`
              : null}
          </div>
        `;
      }

      // Switches on value_type only. engine_type is diagnostic and must never be branched on.
      function ValueView({ descriptor }) {
        if (!descriptor || typeof descriptor !== "object") {
          return html`<div class="value"><span class="muted">no value</span></div>`;
        }
        const valueType = descriptor.value_type || "?";
        const sources = Array.isArray(descriptor.sources) ? descriptor.sources : [];
        const isScalar = SCALAR_TYPES.indexOf(valueType) !== -1;

        return html`
          <div class="value">
            <div class="head">
              <span class="vt">${valueType}</span>
              ${valueType === "GTImage" && sources.length > 1
                ? html`<span class="badge warn">SEQUENCE, ${sources.length} sources</span>`
                : null}
              ${!isScalar && sources.length === 0
                ? html`<span class="badge bad">no sources</span>`
                : null}
            </div>

            ${isScalar
