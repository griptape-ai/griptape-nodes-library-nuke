              ? html`<div class="muted">
                  Scalar type. The descriptor carries the type only, not the value.
                </div>`
              : null}

            ${sources.map(
              (source) => html`<${Source} valueType=${valueType} source=${source || {}} />`,
            )}

            ${PREVIEWABLE[valueType]
              ? html`<div class="muted">
                  ${descriptor.colorspace
                    ? "colorspace: " + descriptor.colorspace
                    : "colorspace: unspecified. This page assumes scene-linear, and says so rather than assuming silently."}
                </div>`
              : null}

            <div class="diag">
              engine_type: ${descriptor.engine_type || "?"} (diagnostic only, never branch on this)
            </div>
          </div>
        `;
      }

      /* ------------------------------------------------------------- panel tab */

      // One knob per declared input parameter, with the widget chosen from its host type. That is
      // the point of the declaration: the panel is generated, not hand-written per workflow.
      function Knob({ param, value, locked }) {
        const key = paramKey(param.node, param.parameter);
        const set = (v) => setKnob(param, v);
        const isFile = ["GTImage", "GTMovie", "GTFile"].indexOf(param.type) !== -1;
        // Two reasons a knob is not editable, and an artist needs to tell them apart: settable
        // false means the engine will refuse a value for this parameter, ever; locked means a run
        // is in flight and the whole panel is frozen until it ends.
        const readOnly = param.settable === false;
        const disabled = readOnly || locked;

        let widget;
        if (param.type === "GTBool") {
          widget = html`<input
            type="checkbox"
            disabled=${disabled}
            checked=${value === true}
            onChange=${(e) => set(e.target.checked)}
          />`;
        } else if (param.type === "GTNumber") {
          widget = html`<input
            type="number"
            step="any"
            disabled=${disabled}
            value=${value === undefined ? "" : value}
            onInput=${(e) => set(e.target.value)}
          />`;
        } else if (param.type === "GTNull") {
          widget = html`<input type="text" disabled placeholder="declared GTNull, nothing to send" />`;
        } else {
          widget = html`<input
            type="text"
            disabled=${disabled}
            placeholder=${isFile ? "/path/to/plate.####.exr" : ""}
            value=${value === undefined ? "" : value}
            onInput=${(e) => set(e.target.value)}
          />`;
        }

        return html`
          <div class=${"knob" + (isFile ? " file" : "")}>
            <label title=${param.tooltip || ""}>${param.name || key}</label>
            <div class="widget">${widget}</div>
            <span class="type">${param.type || "?"}</span>
            ${readOnly ? html`<span class="badge">read-only</span>` : null}
            ${KNOWN_VALUE_TYPES.indexOf(param.type) === -1
              ? html`<span class="muted">unrecognized type, sent as text</span>`
              : null}
          </div>
        `;
      }

      // The workflow menu an artist actually uses. A studio ships one plugin against many
      // workflows, so this is a menu, not a browser: no ids, no availability plumbing.
      //
      // Picking describes, which reads the registry and changes nothing. Loading is a second,
      // deliberate press, because it clears the engine and takes an editor user's open comp with
      // it. A dropdown that loads on change is a dropdown that destroys work on a mis-click.
      function WorkflowPicker({ st }) {
        const runnable = st.workflows.filter((workflow) => workflow.runnable);
        const blocked = st.workflows.filter((workflow) => !workflow.runnable);
        const described = st.described;
        const loadedId = (st.loaded && st.loaded.workflow_id) || "";
        const isLoaded = described && described.workflow_id === loadedId;

        return html`
          <div class="pane">
            <h2>Griptape</h2>
            <div class="body">
              <div class="knob">
                <label>workflow</label>
                <div class="widget">
                  <select
                    disabled=${!st.session || st.runActive}
                    value=${(described && described.workflow_id) || ""}
                    onChange=${(e) => {
                      if (!e.target.value) return;
                      guard(() => doDescribe(e.target.value))();
                    }}
                  >
                    <option value="">
                      ${runnable.length ? "select a workflow" : "none available"}
                    </option>
                    ${runnable.map(
                      (workflow) => html`
                        <option value=${workflow.id}>${workflow.name || workflow.id}</option>
                      `,
                    )}
                  </select>
                </div>
              </div>

              ${!st.session
                ? html`<div class="muted">Waiting for an engine.</div>`
                : !described
                  ? html`<div class="muted">
                      Picking one describes it. Nothing is loaded and nothing is disturbed.
                    </div>`
                  : html`
                      ${described.description
                        ? html`<div class="muted">${described.description}</div>`
                        : null}
                      <div class="muted">
                        Declares ${(described.inputs || []).length} input(s) and
                        ${(described.outputs || []).length} output(s).
                      </div>
                      ${isLoaded
                        ? html`<div class="stack" style="margin-top: 8px">
                            <span class="badge warn">LOADED</span>
                            <span class="muted">The knobs below drive this workflow.</span>
                          </div>`
                        : html`
                            <div class="stack" style="margin-top: 8px">
                              <button
                                class="primary"
                                disabled=${st.runActive}
                                onClick=${guard(() =>
                                  doLoad({ workflow_id: described.workflow_id }),
                                )}
                              >
                                Load into the engine
                              </button>
                            </div>
                            <div class="muted">
                              ${loadedId
                                ? "This discards " +
                                  loadedId +
                                  ", which is what the knobs below currently drive."
                                : "The engine clears all object state to load a graph, so this " +
                                  "discards whatever it holds, including a comp an editor user " +
                                  "has open."}
                            </div>
                          `}
                    `}

              ${blocked.length
                ? html`<div>
                    <h3 class="subhead">Not offered</h3>
                    <!-- Reported rather than hidden. An artist who cannot find a workflow they
                         were told to use needs the reason, not an absence. -->
                    ${blocked.map(
                      (workflow) => html`
                        <div class="row">
                          <div class="stack">
                            <span>${workflow.name || workflow.id}</span>
                            <span class="badge bad">unavailable</span>
                          </div>
                          <div class="muted">${workflow.unavailable_reason || ""}</div>
                        </div>
                      `,
                    )}
                  </div>`
                : null}

              <h3 class="subhead">Load a workflow file directly</h3>
              <div class="stack">
                <input
                  type="text"
                  placeholder="/shots/sq010/comp_v012.py"
                  disabled=${st.runActive}
                  value=${st.loadFilePath}
                  onInput=${(e) => setState({ loadFilePath: e.target.value })}
                />
                <button
                  disabled=${!st.session || st.runActive || !st.loadFilePath.trim()}
                  onClick=${guard(() => doLoad({ file_path: st.loadFilePath.trim() }))}
                >
                  Load
                </button>
              </div>
              <div class="muted">
                What a plugin does behind a file browser knob: the engine imports, registers, then
                loads it, and the reply names the id it resolved to. Send one selector or the
                other, never both, since they can name different workflows.
              </div>
            </div>
          </div>
        `;
      }

      function Properties({ st }) {
        const loaded = st.loaded;
        const declared = (loaded && loaded.inputs) || [];
        return html`
          <div class="pane">
            <h2>${loaded ? loaded.name || "(unnamed)" : "Properties"}</h2>
            <div class="body">
              ${!loaded
                ? html`<div class="empty">Pick a workflow to build its knobs.</div>`
                : html`
                    ${loaded.description
                      ? html`<div class="muted">${loaded.description}</div>`
                      : null}
                    ${!declared.length
                      ? html`<div class="empty">This workflow declares no inputs.</div>`
                      : declared.map(
                          (param) => html`
                            <${Knob}
                              param=${param}
                              locked=${st.runActive}
                              value=${st.knobs[paramKey(param.node, param.parameter)]}
                            />
                          `,
                        )}

                    <div class="stack" style="margin-top: 10px">
                      <!-- One button, because there is one execution at a time. A separate Cancel
                           that is live while nothing runs invites an artist to press it. -->
                      ${st.runActive
                        ? html`<button class="danger" onClick=${guard(doCancel)}>
                            Cancel render
                          </button>`
                        : html`<button
                            class="primary"
                            disabled=${!st.session}
                            onClick=${guard(doRun)}
                          >
                            Render
                          </button>`}
                      <label title="Write each knob edit through to the engine, coalesced.">
                        <input
                          type="checkbox"
                          checked=${st.writeThrough}
                          onChange=${(e) => setState({ writeThrough: e.target.checked })}
                        />
                        live knobs
                      </label>
                      ${st.writeThrough
                        ? null
                        : html`<button disabled=${st.runActive} onClick=${guard(() => doSetValues())}>
                            Apply knobs
                          </button>`}
                    </div>

                    <p class="note">
                      Knobs were initialized from <code>input_values</code>, what the graph holds,
                      not from each descriptor's <code>default</code>, which is the workflow
                      author's value. With live knobs on, an edit is written through coalesced, so
                      the engine holds what this panel shows. Writes are refused mid-render and the
                      panel locks instead: the engine's scheduler decides when a node reads a
                      parameter, so a value set during a run cannot be told apart from one that
                      landed too late.
                    </p>
                    ${st.lastSet
                      ? html`<div class="muted">
                          last write: ${(st.lastSet.applied_inputs || []).length} applied,
                          ${(st.lastSet.rejected_inputs || []).length} rejected
                        </div>`
                      : null}
                  `}
            </div>
          </div>
        `;
      }

      // The end of the integration, and the only part an artist judges it by: what lands in the
      // DAG. Nuke's Python API is what a plugin calls, so that is what this reports. Nothing here
      // builds .nk text.
      function nukeNodePlan(param, descriptor) {
        if (!descriptor || typeof descriptor !== "object") return [];
        const valueType = descriptor.value_type || "?";
        const sources = Array.isArray(descriptor.sources) ? descriptor.sources : [];

        if (valueType === "GTNull") {
          return [{ note: "Unset. Nothing to create." }];
        }
        if (SCALAR_TYPES.indexOf(valueType) !== -1) {
          return [
            {
              note:
                "A scalar. It belongs on this panel's own knob, not in the DAG. The descriptor " +
                "reports the type and not the value, so the panel reads it from the parameter " +
                "value event or the bulk read.",
            },
          ];
        }
        if (!sources.length) {
          return [
            {
              note:
                valueType +
                " with no sources should not happen: a value pointing at no bytes is reported as " +
                "GTText instead. Treat it as unavailable rather than creating an empty Read.",
            },
          ];
        }

        return sources.map((source) => {
          const kind = source.kind || "?";
          if (kind === "macro") {
            return {
              note:
                "An unresolved macro, usually a workflow variable that was never substituted. " +
                "Show it as a configuration error. Creating a Read on it turns a config error " +
                "into a mysterious file error.",
            };
          }
          if (kind === "inline") {
            return {
              note:
                "The bytes stayed in the engine, so there is no path to read. Read the same " +
                "value in its url or path form, or treat it as unavailable.",
            };
          }
          if (kind === "url") {
            return {
              call: 'nuke.nodes.Read(file="<localized>")',
              note:
                "A URL, and this layer moves no bytes. The plugin fetches it to the show's " +
                "cache first, then reads the local copy. A Read node cannot take an http path.",
              source: source.value || "",
            };
          }
          if (kind === "path") {
            const call = source.is_pattern
              ? 'nuke.nodes.Read(file="' +
                (source.value || "") +
                '", first=<first>, last=<last>)'
              : 'nuke.nodes.Read(file="' + (source.value || "") + '")';
            return {
              call,
              note: source.is_pattern
                ? "Frame padding. Correct for a Read node's file knob and invalid for a direct " +
                  "open, so check is_pattern before any fopen. The range is not in the " +
                  "descriptor; a plugin scans the directory or asks the artist."
                : "A single frame. Feed it straight to a Read node.",
              source: source.value || "",
            };
          }
          return {
            note:
              "Unrecognized source kind, left alone. A plugin binary outlives the version bump a " +
              "new kind costs, so an unknown kind must never be fatal.",
          };
        });
      }

      function NodePlan({ st }) {
        const declared = (st.loaded && st.loaded.outputs) || [];
        const mediaTypes = declared.filter(
          (param) => SCALAR_TYPES.indexOf(param.type) === -1,
        ).length;

        return html`
          <div class="pane">
            <h2>Into the comp</h2>
            <div class="body">
              ${!declared.length
                ? html`<div class="empty">
                    Pick a workflow to see what it would put in the DAG.
                  </div>`
                : html`<div class="muted">
                    ${declared.length} declared output(s), ${mediaTypes} of them media. "Outputs"
                    means exactly these: the end-flow parameters the workflow declared, never
                    whichever node control flow happened to finish on.
                  </div>`}
              ${declared.map((param) => {
                const entry = st.outputValues[paramKey(param.node, param.parameter)];
                const plan = entry ? nukeNodePlan(param, entry.value) : [];
                return html`
                  <div class="row">
                    <div class="stack">
                      <span>${param.name || paramKey(param.node, param.parameter)}</span>
                      <span class="badge">${param.type || "?"}</span>
                      ${entry
                        ? html`<span class="muted">
                            ${entry.live ? "pushed" : "read"} as
                            <b>${(entry.value || {}).value_type || "?"}</b>
                          </span>`
                        : null}
                    </div>
                    ${!entry
                      ? html`<div class="empty">no value yet</div>`
                      : plan.map(
                          (step) => html`
                            <div class="plan">
                              ${step.call ? html`<div class="call">${step.call}</div>` : null}
                              <div class="muted">${step.note}</div>
                              ${step.call && step.source
                                ? html`<button
                                    onClick=${() =>
                                      navigator.clipboard &&
                                      navigator.clipboard.writeText(step.source)}
                                  >
                                    Copy path
                                  </button>`
                                : null}
                            </div>
                          `,
                        )}
                  </div>
                `;
              })}

              <p class="note">
                Built from each descriptor's <code>value_type</code> and never from the parameter's
                declared <code>type</code>. A parameter declared as an unmapped artifact class
                reports <code>GTFile</code> before a value exists and may arrive as an image, so a
                plugin that branches on the declaration at runtime creates the wrong node.
              </p>
            </div>
          </div>
        `;
      }

      // The progress bar the protocol makes possible: resolved node states over the run's node
      // set. The ratio can top out below 1.0 on a clean run, because the total counts what a flow
      // declares and an untaken branch never resolves.
      function Progress({ st }) {
        const total = st.runTotal;
        const resolved = st.nodeStates.filter((e) => e.state === "resolved").length;
        const denominator = total ? total.length : 0;
        const ratio = denominator ? Math.min(resolved / denominator, 1) : 0;
        const subflows = st.executionNodeSets.filter((set) => set.length > 0).length - 1;
        const active = st.nodeStates.filter((e) => e.state === "running");

        return html`
          <div>
            <div class="stack">
              <span class="muted">progress</span>
              <span>
                ${denominator ? resolved + " / " + denominator : resolved + " / ?"}
              </span>
              ${active.length
                ? html`<span class="muted">${active.map((e) => e.node).join(", ")}</span>`
                : null}
              ${subflows > 0
                ? html`<span class="badge">${subflows} subflow node set(s)</span>`
                : null}
            </div>
            <div class="bar">
              <div
                class=${"fill" + (denominator ? "" : " unknown")}
                style=${"width: " + (denominator ? (ratio * 100).toFixed(1) : 100) + "%"}
              ></div>
            </div>
            <div class="muted">
              ${!denominator
                ? "No total yet. A flow whose start node is also its end node emits none at all, so a plugin must tolerate a run it never gets a total for."
                : "Denominator is the first non-empty node set, which is the top-level flow's. Later non-empty lists are subflows, never corrections to the total."}
            </div>
          </div>
        `;
      }

      function Execution({ st }) {
        return html`
          <div class="pane">
            <h2>Render</h2>
            <div class="body">
              ${st.loaded ? html`<${Progress} st=${st} />` : null}

              ${!st.execution
                ? html`<div class="empty">Nothing has run on this connection.</div>`
                : html`
                    <div class="stack">
                      <span
                        class=${"chip " +
                        stateClass(st.execution.state, TERMINAL_EXECUTION_STATES.concat(["running"]))}
                      >
                        ${st.execution.state || "?"}
                      </span>
                      <span class="muted">terminal_node: ${st.execution.terminal_node || "-"}</span>
                    </div>
                    ${st.execution.detail ? html`<div>${st.execution.detail}</div>` : null}
                  `}

              <p class="note">
                <code>completed</code> means the engine finished the flow, not that it succeeded:
                the terminal event fires on a clean run and an errored one and carries no status. An
                actual failure shows up only as a live node state event with <code>failed</code>,
                which no later read can recover, so the node list below is the only place a plugin
                can surface one.
              </p>

              <h3 class="subhead">Nodes</h3>
              ${!st.nodeStates.length
                ? html`<div class="empty">No node state events yet.</div>`
                : st.nodeStates.map(
                    (entry) => html`
                      <div class="row">
                        <div class="stack">
                          <span class=${"chip " + stateClass(entry.state, KNOWN_NODE_STATES)}>
                            ${entry.state || "?"}
                          </span>
                          <span>${entry.node}</span>
                        </div>
                        ${entry.detail ? html`<div class="muted">${entry.detail}</div>` : null}
                      </div>
                    `,
                  )}

              <h3 class="subhead">Backstop poll</h3>
              <div class="muted">
                ${st.pollTicks
                  ? st.pollTicks +
                    " tick(s), each one frame carrying execution state and output values together. " +
                    (st.pollSummary || "")
                  : "Runs only while a render is live. Delivery is fire and forget with no replay, " +
                    "so a plugin cannot let a render's outcome depend on having received every " +
                    "event. Two verbs in one batched frame rather than two frames per tick."}
              </div>
              <div class="stack" style="margin-top: 6px">
                <button disabled=${!st.loaded} onClick=${guard(() => doPollTick())}>
                  Poll once now
                </button>
                <button disabled=${!st.loaded} onClick=${guard(doReadValues)}>
                  Re-read values
                </button>
              </div>
            </div>
          </div>
        `;
      }

      /* ------------------------------------------------------------ session tab */
      //
      // Everything a plugin owns that an artist never sees, plus the one action a supervisor takes.

      function SessionTab({ st }) {
        const current = st.currentProject;
        const described = st.describedProject;
        const waiting = st.nextAttemptAt
          ? Math.max(0, Math.round((st.nextAttemptAt - Date.now()) / 1000))
          : null;

        return html`
          <div>
            <div class="cols" style="grid-template-columns: minmax(340px, 1fr) minmax(340px, 1fr)">
              <div class="pane">
                <h2>Connection</h2>
                <div class="body">
                  <p class="note">
                    A panel inside Nuke has no Connect button: it comes up with the comp and finds
                    the engine itself, then keeps finding it. The host and port are a plugin
                    preference, never discovered: the engine writes files that look like a registry
                    and they carry no compatibility promise, so a plugin that parses them binds to
                    the one surface that is explicitly unversioned.
                  </p>
                  <div class="knob">
                    <label>engine</label>
                    <div class="widget">
                      <input
                        type="text"
                        value=${st.wsUrl}
                        onInput=${(e) => setState({ wsUrl: e.target.value })}
                      />
                    </div>
                  </div>
                  <div class="knob">
                    <label>client_name</label>
                    <div class="widget">
                      <input
                        type="text"
                        value=${st.clientName}
                        onInput=${(e) => setState({ clientName: e.target.value })}
                      />
                    </div>
                  </div>
                  <div class="muted">
                    Free text, for logs and support tickets. It is the only thing that tells a
                    studio which of forty workstations opened a session.
                  </div>

                  <div class="stack" style="margin-top: 10px">
                    <label>
                      <input
                        type="checkbox"
                        checked=${st.autoConnect}
                        onChange=${(e) => {
                          setState({ autoConnect: e.target.checked });
                          if (e.target.checked && !st.session) guard(doConnect)();
                          else cancelReconnect();
                        }}
                      />
                      keep connected
                    </label>
                    <button disabled=${Boolean(st.session)} onClick=${guard(doConnect)}>
                      Connect now
                    </button>
                    <button disabled=${!st.autoConnect && !st.session} onClick=${doDisconnect}>
                      Close panel
                    </button>
                  </div>

                  <table style="margin-top: 10px">
                    <tbody>
                      <tr><th>socket</th><td>${st.socket}</td></tr>
                      <tr><th>attempts since last success</th><td>${st.connectAttempts}</td></tr>
                      <tr><th>reconnects this session</th><td>${st.reconnects}</td></tr>
                      <tr>
                        <th>next attempt</th>
                        <td>
                          ${waiting === null
                            ? st.autoConnect
                              ? "not scheduled"
                              : "retry is off"
                            : "in " + waiting + "s"}
                        </td>
                      </tr>
                    </tbody>
                  </table>

                  <h3 class="subhead">Recovery drill</h3>
                  <div class="muted">
                    Dropping the socket is the failure a plugin is least likely to have tested and
                    most likely to meet. Do it under a live render: notifications sent while
                    disconnected are gone for good, and the resync is what has to make up for it.
                  </div>
                  <div class="stack" style="margin-top: 6px">
                    <button class="danger" disabled=${!st.session} onClick=${doDropSocket}>
                      Drop the socket
                    </button>
                  </div>
                </div>
              </div>

              <div class="pane">
                <h2>Resync sequence</h2>
                <div class="body">
                  <p class="note">
                    One sequence, run on first connect and on every reconnect. A plugin with a
                    separate startup path and recovery path has two paths and only ever tests one.
                    Order is load-bearing: subscribe before requesting, or the reply is published to
                    a topic this connection is not listening on.
                  </p>
                  ${!st.resyncSteps.length
                    ? html`<div class="empty">Nothing has run yet.</div>`
                    : st.resyncSteps.map(
                        (step, index) => html`
                          <div class="row">
                            <div class="stack">
                              <span class=${"chip " + (step.outcome === "ok" ? "resolved" : step.outcome === "warn" ? "running" : "failed")}>
                                ${index + 1}
                              </span>
                              <span>${step.label}</span>
                            </div>
                            ${step.detail ? html`<div class="muted">${step.detail}</div>` : null}
                          </div>
                        `,
                      )}
                </div>
              </div>
            </div>

            <div class="pane" style="margin-top: 12px">
              <h2>Project (supervisor)</h2>
              <div class="body">
                <p class="note">
                  Workflows are registered per workspace and a project decides the workspace, so the
                  workflow menu an artist sees is a menu for whichever project the engine is on.
                  Switching is a show-level action, not a shot-level one: it can re-register every
                  workflow and reload every library, this one included, which tears down the panel's
                  own handlers and its event stream. So it sits behind a gate rather than in the
                  artist's panel.
                </p>

                <table>
                  <tbody>
                    <tr>
                      <th>current</th>
                      <td>${(current && (current.name || "(no name reported)")) || "none set"}</td>
                    </tr>
                    <tr>
                      <th>workspace_dir</th>
                      <td class="mono">${(current && current.workspace_dir) || ""}</td>
                    </tr>
                    <tr>
                      <th>file_path</th>
                      <td class="mono">
                        ${current
                          ? current.file_path || "(no backing file: system defaults)"
                          : ""}
                      </td>
                    </tr>
                    <tr>
                      <th>validation</th>
                      <td>
                        ${!current
                          ? ""
                          : html`<span
                                class=${"badge" +
                                (usableProject(current.validation_status) ? "" : " bad")}
                              >
                                ${current.validation_status || "?"}
                              </span>
                              ${(current.problems || []).join(" | ")}`}
                      </td>
                    </tr>
                  </tbody>
                </table>
                ${!current
                  ? html`<div class="muted">
                      No current project, which the engine treats as distinct from being on the
                      system defaults.
                    </div>`
                  : null}

                <div class="stack" style="margin-top: 10px">
                  <label>
                    <input
                      type="checkbox"
                      checked=${st.supervisor}
                      onChange=${(e) => {
                        setState({ supervisor: e.target.checked });
                        if (e.target.checked && st.session) guard(doListProjects)();
                      }}
                    />
                    unlock project switching
                  </label>
                  <button disabled=${!st.session} onClick=${guard(doReadCurrentProject)}>
                    Re-read current
                  </button>
                </div>

                ${!st.supervisor
                  ? null
                  : html`
                      <div class="stack" style="margin: 10px 0">
                        <button disabled=${!st.session} onClick=${guard(doListProjects)}>
                          Refresh list
                        </button>
                        <label>
                          <input
                            type="checkbox"
                            checked=${st.includeSystemBuiltins}
                            onChange=${(e) => {
                              setState({ includeSystemBuiltins: e.target.checked });
                              if (st.session) guard(doListProjects)();
                            }}
                          />
                          include system builtins
                        </label>
                        <button
                          disabled=${!st.session || st.runActive}
                          onClick=${guard(() => doSetProject(null))}
                        >
                          Switch to system defaults
                        </button>
                        <span class="muted">${st.projectNote}</span>
                      </div>

                      ${!st.projects.length
                        ? html`<div class="empty">No projects returned.</div>`
                        : st.projects.map(
                            (project) => html`
                              <div
                                class=${"item" +
                                (described && described.project_id === project.id ? " sel" : "")}
                                onClick=${() => guard(() => doDescribeProject(project.id))()}
                              >
                                <div class="stack">
                                  <!-- name is empty for a failed entry rather than falling back to
                                       the opaque id, so there is nothing to display for one. -->
                                  <span class="name">${project.name || "(no name reported)"}</span>
                                  ${project.current
                                    ? html`<span class="badge warn">CURRENT</span>`
                                    : null}
                                  <span class=${project.available ? "badge" : "badge bad"}>
                                    ${project.available ? "available" : "unavailable"}
                                  </span>
                                </div>
                                ${!project.available && project.unavailable_reason
                                  ? html`<div class="sub">${project.unavailable_reason}</div>`
                                  : null}
                                <div class="sub">${project.file_path || "(no backing file)"}</div>
                                ${project.current || !project.available
                                  ? null
                                  : html`<div class="stack" style="margin-top: 5px">
                                      <button
                                        disabled=${st.runActive}
                                        onClick=${(e) => {
                                          e.stopPropagation();
                                          guard(() => doSetProject(project.id))();
                                        }}
                                      >
                                        Switch
                                      </button>
                                      <span class="muted">reconnects afterwards</span>
                                    </div>`}
                              </div>
                            `,
                          )}

                      ${described
                        ? html`<div style="margin-top: 10px">
                            <h3 class="subhead">Preview, without switching</h3>
                            <div class="name">${described.name || "(no name reported)"}</div>
                            <table>
                              <tbody>
                                <tr>
                                  <th>workspace_dir</th>
                                  <td class="mono">
                                    ${described.workspace_dir || "(no readable project file)"}
                                  </td>
                                </tr>
                                <tr>
                                  <th>validation</th>
                                  <td>
                                    <span
                                      class=${"badge" +
                                      (usableProject(described.validation_status) ? "" : " bad")}
                                    >
                                      ${described.validation_status || "?"}
                                    </span>
                                    ${(described.problems || []).join(" | ")}
                                  </td>
                                </tr>
                              </tbody>
                            </table>
                            <div class="muted">
                              Where this project's renders would land, read before committing to it.
                            </div>
                          </div>`
                        : null}
                    `}
              </div>
            </div>
          </div>
        `;
      }

      /* --------------------------------------------------------------- live tab */

      function Stat({ label, value, accent }) {
        return html`
          <div class="stat">
            <div class="k">${label}</div>
            <div class=${"v" + (accent ? " " + accent : "")}>${value}</div>
          </div>
        `;
      }

      // Prefixed to stay clear of the .value class the descriptor renderer already owns.
      function typeClass(payloadType) {
        if (payloadType === NOTIFICATION.NODE_STATE) return "ev-node";
        if (payloadType === NOTIFICATION.PARAMETER_VALUE) return "ev-value";
        if (payloadType === NOTIFICATION.EXECUTION_STATE) return "ev-exec";
        if (payloadType === NOTIFICATION.EXECUTION_NODES) return "ev-nodes";
        return "";
      }

      function LiveTab({ st }) {
        const now = Date.now();
        const streaming = st.lastEventAt && now - st.lastEventAt < 2000;
        const recent = st.feed.filter((entry) => now - entry.at < 3000);
        const resolved = st.nodeStates.filter((e) => e.state === "resolved").length;
        const elapsed = !st.runStartedAt
          ? "-"
          : (((st.runActive ? now : st.lastEventAt || now) - st.runStartedAt) / 1000).toFixed(1) + "s";

        return html`
          <div>
            <div class="banner info">
              <b>Nothing on this tab was requested.</b>
              Every row below arrived unsolicited on the event topic. The request counter is the
              proof: it stops moving while the feed fills. A run started anywhere, including the
              editor or another host, appears here, because the engine fans out to every
              subscribed connection rather than answering a poll.
            </div>
            <div class="stats">
              <${Stat}
                label="stream"
                value=${!st.session ? "offline" : streaming ? "receiving" : "listening"}
                accent=${streaming ? "hot pulse" : "cold"}
              />
              <${Stat} label="events received" value=${st.notifications.length} />
              <${Stat} label="events/sec" value=${(recent.length / 3).toFixed(1)} />
              <${Stat} label="requests sent, total" value=${st.requestsSent} />
              <!-- Zero requests against a live run is the whole claim, so it gets the accent. -->
              <${Stat}
                label="requests during this run"
                value=${st.requestsDuringRun}
                accent=${st.runOrigin && st.requestsDuringRun === 0 ? "hot" : ""}
              />
              <${Stat} label="run started by" value=${st.runOrigin || "-"} />
              <${Stat} label="elapsed" value=${elapsed} />
              <${Stat}
                label="nodes resolved"
                value=${st.runTotal
                  ? resolved + " / " + st.runTotal.length
                  : st.nodeStates.length
                    ? resolved + " / ?"
                    : "-"}
              />
              <${Stat}
                label="node sets received"
                value=${st.executionNodeSets.length || "-"}
              />
            </div>
            <p class="note">
              "elsewhere" is inferred, not reported. The protocol carries no execution id, so this
              page knows only that it sent no run request while these events arrived. Nothing in
              the payloads says whose run this is, which is the same gap that makes cancel apply
              to whatever happens to be running. The node-set events carry no flow name either, so
              the total is the first non-empty list by arrival order and every later one is a
              subflow.
            </p>
            <div class="stack" style="margin-bottom: 6px">
              <button onClick=${() => setState({ feed: [] })}>Clear feed</button>
              <span class="muted">newest first, capped at ${LIVE_FEED_LIMIT}</span>
            </div>
            <div class="feed">
              ${!st.feed.length
                ? html`<div class="empty">
                    Nothing yet. Connect, then start a workflow here or from the editor.
                  </div>`
                : st.feed
                    .slice()
                    .reverse()
                    .map(
                      (entry) => html`
                        <div class=${"ev" + (entry.foreign ? " foreign" : "")}>
                          <span class="dt">
                            ${entry.delta === null ? "" : "+" + entry.delta + "ms"}
                          </span>
                          <span class=${"ty " + typeClass(entry.type)}>${entry.type}</span>
                          <span class="su">${entry.summary}</span>
                        </div>
                      `,
                    )}
            </div>
          </div>
        `;
      }

      /* -------------------------------------------------------- conformance tab */

      function ConformanceTab({ st }) {
        const passed = st.checks.filter((c) => c.passed).length;
        const runnable = st.workflows.filter((w) => w.runnable);
        return html`
          <div>
            <div class="banner info">
              <b>What a TD runs against a candidate engine before shipping the plugin to artists.</b>
              Verb by verb, including the refusals, because a plugin binary outlives the engine it
              was built against and the failures are what a studio has to support. The Comp panel
              tab is the same protocol wired the way an artist would meet it.
            </div>
            <div class="stack" style="margin-bottom: 10px">
              <button
                class="primary"
                disabled=${!st.session || st.conformanceRunning}
                onClick=${runConformance}
              >
                ${st.conformanceRunning ? "Running..." : "Run all checks"}
              </button>
              <label for="exercise" class="muted">exercise</label>
              <select
                id="exercise"
                value=${st.conformanceWorkflowId}
                onChange=${(e) => setState({ conformanceWorkflowId: e.target.value })}
              >
                <option value="">
                  ${runnable.length ? "select a workflow" : "no runnable workflows"}
                </option>
                ${runnable.map(
                  (workflow) => html`
                    <option value=${workflow.id}>${workflow.name || workflow.id}</option>
                  `,
                )}
              </select>
              <span class="muted">Every verb in protocol.py, except the project switch.</span>
            </div>
            <div class="banner warn">
              <b>This loads and executes the chosen workflow for real.</b>
              Loading clears the engine, so whatever an editor user has open is discarded. Pick a
              workflow that is cheap to run. The target is chosen explicitly rather than defaulting
              to whichever workflow is listed first, because the first entry is as likely to be a
              generative workflow that costs money and minutes as it is to be a smoke test.
              <code>NukeSetCurrentProjectRequest</code> is the one verb this suite leaves alone: a
              switch reloads every library, this one included, which would tear the suite down
              mid-run. Exercise it by hand on the Projects tab.
            </div>
            ${st.checks.length
              ? html`<div class="score">${passed}/${st.checks.length} checks passed</div>`
              : null}
            ${st.checks.map(
              (check) => html`
                <div class=${"check " + (check.passed ? "pass" : "fail")}>
                  <div class="label">${(check.passed ? "PASS  " : "FAIL  ") + check.label}</div>
                  ${check.meta ? html`<div class="meta">${check.meta}</div>` : null}
                  ${check.extra ? html`<div class="muted">${check.extra}</div>` : null}
                </div>
              `,
            )}
          </div>
        `;
      }

      /* ------------------------------------------------------------- frames tab */

      function Frame({ entry }) {
        const [open, setOpen] = useState(false);
        return html`
          <div>
            <div class="frame" onClick=${() => setOpen(!open)}>
              <span class=${"dir " + entry.direction}>
                ${entry.direction === "out" ? "\u2192" : "\u2190"}
              </span>
              <span class="ts">${entry.at.toISOString().slice(11, 23)}</span>
              <span class="kind">${entry.type}</span>
              <span class="what">${entry.what}</span>
              <span class="rid">${entry.requestId ? entry.requestId.slice(0, 8) : ""}</span>
            </div>
            ${open
              ? html`<pre class="json">${JSON.stringify(entry.frame, null, 2)}</pre>`
              : null}
          </div>
        `;
      }

      function FramesTab({ st }) {
        const filter = st.frameFilter.trim().toLowerCase();
        const visible = useMemo(
          () =>
            st.frames.filter((entry) =>
              filter
                ? (entry.type + " " + entry.what + " " + entry.requestId)
                    .toLowerCase()
                    .indexOf(filter) !== -1
                : true,
            ),
          [st.frames, filter],
        );

        return html`
          <div>
            <div class="stack" style="margin-bottom: 10px">
              <label for="frameFilter" class="muted">filter</label>
              <input
                id="frameFilter"
                type="text"
                size="30"
                placeholder="type, request_type, payload_type, id"
                value=${st.frameFilter}
                onInput=${(e) => setState({ frameFilter: e.target.value })}
              />
              <button onClick=${() => setState({ frames: [] })}>Clear</button>
              <span class="muted">
                ${visible.length} of ${st.frames.length} frames (capped at ${FRAME_LOG_LIMIT})
              </span>
            </div>
            ${!visible.length
              ? html`<div class="empty">No frames match.</div>`
              : visible
                  .slice()
                  .reverse()
                  .map((entry, i) => html`<${Frame} key=${entry.at.getTime() + "-" + i} entry=${entry} />`)}
          </div>
        `;
      }

      /* ------------------------------------------------------------------ shell */

      const TABS = [
        ["panel", "Comp panel"],
        ["session", "Plugin session"],
        ["live", "Live push"],
        ["conformance", "Studio checks"],
        ["frames", "Frames"],
      ];

      function TopBar({ st }) {
        const dot = st.session ? "on" : st.socket === "connecting" ? "busy" : "off";
        return html`
          <div class="topbar">
            <span class="title">GRIPTAPE</span>
            <span><span class=${"dot " + dot}></span>${st.socket}</span>
            <span class="muted">${st.wsUrl}</span>
            ${st.runActive ? html`<span class="badge warn">RENDERING</span>` : null}
            <span style="flex: 1 1 auto"></span>
            <!-- Connection controls live on the session tab, because an artist has none: the panel
                 connects itself. This is a status line, not a control panel. -->
            <button onClick=${() => setState({ tab: "session" })}>Session</button>
          </div>
        `;
      }

      function StatusStrip({ st }) {
        const session = st.session || {};
        const dot = (on) => "dot " + (on ? "on" : "off");
        return html`
          <div class="status">
            <span>
              <span class=${dot(st.socket === "connected")}></span>
              <span>${st.socket}</span>
            </span>
            <span>protocol <b>${session.protocol_version || "-"}</b></span>
            <span>engine <b>${session.engine_version || "-"}</b></span>
            <span>library <b>${session.library_version || "-"}</b></span>
            <!-- Read off the connect result, the one place this protocol versions. The result
                 envelope carries them too and promises nothing about continuing to. -->
            <span>engine name <b>${session.engine_name || "-"}</b></span>
            <span>project <b>${(st.currentProject && st.currentProject.name) || "-"}</b></span>
            <span>loaded <b>${(st.loaded && st.loaded.workflow_id) || "-"}</b></span>
            <span><span class=${dot(st.subscribed.reply)}></span>reply topic</span>
            <span>
              <span class=${dot(st.subscribed.events)}></span>
              event topic <b>${session.event_topic || "-"}</b>
            </span>
            <span>notifications <b>${st.notifications.length}</b></span>
          </div>
        `;
      }

      function App() {
        const st = useStore();

        // A panel inside Nuke connects when it opens. Nothing here waits for a click.
        useEffect(() => {
          guard(doConnect)();
        }, []);

        // Keeps elapsed time, the event rate, and the reconnect countdown moving between events,
        // so a stalled stream looks stalled rather than slow.
        useEffect(() => {
          if (st.tab !== "live" && st.tab !== "session" && !st.runActive) return undefined;
          const id = setInterval(() => setState({ tick: state().tick + 1 }), 500);
          return () => clearInterval(id);
        }, [st.tab, st.runActive]);

        return html`
          <div>
            <${TopBar} st=${st} />
            <${StatusStrip} st=${st} />
            <!-- Global rather than inside a tab, so a connect failure is visible from anywhere. -->
            ${st.banner
              ? html`<div class=${"banner " + st.banner.kind} style="margin: 10px 12px 0">
                  <b>${st.banner.title}</b>
                  <div>${st.banner.text}</div>
                </div>`
              : null}
            <div class="tabs">
              ${TABS.map(
                ([id, label]) => html`
                  <button
                    class=${st.tab === id ? "active" : ""}
                    onClick=${() => setState({ tab: id })}
                  >
                    ${label}
                  </button>
                `,
              )}
            </div>
            <div class="tab active">
              ${st.tab === "panel"
                ? html`<div class="cols">
                    <div>
                      <${WorkflowPicker} st=${st} />
                      <div style="height: 12px"></div>
                      <${Properties} st=${st} />
                    </div>
                    <${Execution} st=${st} />
                    <${NodePlan} st=${st} />
                  </div>`
                : null}
              ${st.tab === "session" ? html`<${SessionTab} st=${st} />` : null}
              ${st.tab === "live" ? html`<${LiveTab} st=${st} />` : null}
              ${st.tab === "conformance" ? html`<${ConformanceTab} st=${st} />` : null}
              ${st.tab === "frames" ? html`<${FramesTab} st=${st} />` : null}
            </div>
          </div>
        `;
      }

      const root = document.getElementById("app");
      clearTimeout(window.__bootTimer);
      root.dataset.rendered = "1";
      root.innerHTML = "";
      render(html`<${App} />`, root);
    </script>
  </body>
</html>
