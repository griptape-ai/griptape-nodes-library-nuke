<!doctype html>
<!--
Browser host client for the Nuke host API.

A stand-in for the Nuke plugin: connects to a live Griptape Nodes engine over the
websocket_direct IPC driver, builds knobs from a workflow's declared ports, runs it, and
consumes the pushed notifications. The sibling of scripts/nuke_host_client.py.

The contract is nuke_host_api/INTEGRATION.md. Nothing here names an engine type.

Preact and htm are loaded as ES modules from esm.sh, pinned by the import map below, so
there is no build step. That means this page needs network access on first load to fetch
those two modules; the engine socket itself stays local. If the modules cannot be fetched
the page says so rather than rendering blank.

Read the transport section for the parts a plugin must reimplement. The components below
are only presentation.
-->

          "preact/": "https://esm.sh/preact@10.23.1/",

        }

  <body>
    <div id="app">
      <div style="padding: 20px; color: #868686">Loading modules...</div>
    </div>
    <script>
      // Preact and htm are fetched from a CDN by the module below. Without this, a machine with
      // no network access would show nothing at all and look broken rather than offline.
      window.__bootTimer = setTimeout(function () {
        var root = document.getElementById("app");
        if (!root || root.dataset.rendered) return;
        root.innerHTML =
          '<div style="padding:20px;max-width:760px;line-height:1.6">' +
          '<b style="color:#c8452f">Could not load preact and htm from esm.sh.</b>' +
          "<p>This page has no build step, so it fetches those two modules over the network on " +
          "first load. The engine connection itself is local and unaffected.</p>" +
          "<p>On a machine without internet access, serve the two modules locally and change the " +
          "import map at the top of this file to point at them.</p></div>";
      }, 8000);
    </script>
    <script type="module">
      import { h, render } from "preact";
      import { useState, useEffect, useMemo } from "preact/hooks";
      import htm from "htm";

      const html = htm.bind(h);

      /* ------------------------------------------------------- the frozen surface */
      // Everything a host may name on the wire. Nothing outside this block is a contract.

      const VERB = {
        CONNECT: "NukeConnectRequest",
        LIST_WORKFLOWS: "NukeListWorkflowsRequest",
        DESCRIBE_WORKFLOW: "NukeDescribeWorkflowRequest",
        EXECUTE_WORKFLOW: "NukeExecuteWorkflowRequest",
        GET_EXECUTION_STATE: "NukeGetExecutionStateRequest",
        CANCEL_EXECUTION: "NukeCancelExecutionRequest",
      };
      const NOTIFICATION = {
        NODE_STATE: "NukeNodeStateEvent",
        PARAMETER_VALUE: "NukeParameterValueEvent",
        EXECUTION_STATE: "NukeExecutionStateEvent",
      };
      const CLIENT_PROTOCOL_VERSIONS = [1];
      const TERMINAL_EXECUTION_STATES = ["completed", "failed", "cancelled"];
      const KNOWN_NODE_STATES = ["unresolved", "running", "resolved", "failed"];
      const KNOWN_VALUE_TYPES = [
        "GTImage",
        "GTVideo",
        "GTFile",
        "GTText",
        "GTNumber",
        "GTBoolean",
        "GTNull",
      ];
      // Types that carry no sources. The descriptor reports the type but not the scalar.
      const SCALAR_TYPES = ["GTText", "GTNumber", "GTBoolean", "GTNull"];
      const PREVIEWABLE = { GTImage: "img", GTVideo: "video" };

      const REPLY_TOPIC = "nuke-host-browser/reply";
      const REQUEST_TIMEOUT_MS = 60000;
      // The first request gets a shorter budget, because its usual failure is a library that is
      // not installed, and the engine answers an unhandled request type with silence.
      const CONNECT_TIMEOUT_MS = 12000;
      const DRAIN_MS = 20000;
      const DRAIN_GRACE_MS = 800;
      const FRAME_LOG_LIMIT = 500;
      const LIVE_FEED_LIMIT = 200;

      /* ------------------------------------------------------------------- store */
      //
      // State lives here rather than in component closures, because the socket mutates it from
      // callbacks that are outside any component. Components subscribe and re-render.
      //
      // Emits are coalesced into one render per frame. Without that, a burst of ~60 parameter
      // value events in the same millisecond would trigger ~60 renders, and the old imperative
      // version needed hand-rolled dirty flags to avoid exactly that.

      const store = {
        state: {
          wsUrl: "ws://127.0.0.1:18125",
          clientName: "Nuke 16.0v7 (browser host)",
          socket: "disconnected",
          session: null,
          subscribed: { reply: false, events: false },
          workflows: [],
          runnableOnly: true,
          described: null,
          knobs: {},
          nodeStates: [],
          outputValues: {},
          execution: null,
          lastRun: null,
          banner: null,
          pollSummary: "",
          notifications: [],
          frames: [],
          frameFilter: "",
          feed: [],
          requestsSent: 0,
          requestsDuringRun: 0,
          runActive: false,
          runOrigin: null,
          runStartedAt: null,
          lastEventAt: null,
          tab: "panel",
          checks: [],
          conformanceRunning: false,
          conformanceWorkflowId: "",
          tick: 0,
        },
        listeners: new Set(),
        scheduled: false,
      };

      function setState(patch) {
        Object.assign(store.state, patch);
        scheduleRender();
      }

      function scheduleRender() {
        if (store.scheduled) return;
        store.scheduled = true;
        requestAnimationFrame(() => {
          store.scheduled = false;
          store.listeners.forEach((listener) => listener());
        });
      }

      function useStore() {
        const [, bump] = useState(0);
        useEffect(() => {
          const listener = () => bump((n) => n + 1);
          store.listeners.add(listener);
          return () => store.listeners.delete(listener);
        }, []);
        return store.state;
      }

      const state = () => store.state;
      const portKey = (node, parameter) => node + "." + parameter;
      const stateClass = (value, known) =>
        known.indexOf(value) === -1 ? "unknown" : value;

      /* --------------------------------------------------------------- transport */
      //
      // This section is the part a real plugin must reimplement. It touches no components.

      let ws = null;
      const pending = new Map();

      function logFrame(direction, frame) {
        const payload = (frame && frame.payload) || {};
        const frames = state().frames.concat([
          {
            direction,
            at: new Date(),
            type: frame && frame.type ? frame.type : payload.event_type || "?",
            what:
              payload.request_type ||
              payload.payload_type ||
              payload.result_type ||
              frame.topic ||
              "",
            requestId: payload.request_id || frame.id || "",
            frame,
          },
        ]);
        setState({
          frames:
            frames.length > FRAME_LOG_LIMIT
              ? frames.slice(frames.length - FRAME_LOG_LIMIT)
              : frames,
        });
      }

      function sendFrame(frame) {
        if (!ws || ws.readyState !== WebSocket.OPEN) {
          throw new Error("Socket is not open.");
        }
        ws.send(JSON.stringify(frame));
        logFrame("out", frame);
      }

      function subscribe(topic) {
        sendFrame({ type: "subscribe", topic });
      }

      // One request in, one reply out, correlated by request_id and never by arrival order,
      // because notifications share this socket and arrive interleaved.
      function request(requestType, payload, timeoutMs) {
        const requestId =
          Math.random().toString(16).slice(2) + Date.now().toString(16);
        const budget = timeoutMs || REQUEST_TIMEOUT_MS;
        return new Promise((resolve, reject) => {
          const timer = setTimeout(() => {
            pending.delete(requestId);
            reject(
              new Error(
                "Timed out after " +
                  budget / 1000 +
                  "s waiting for a reply to " +
                  requestType,
              ),
            );
          }, budget);
          pending.set(requestId, { resolve, timer });
          setState({
            requestsSent: state().requestsSent + 1,
            requestsDuringRun: state().runActive
              ? state().requestsDuringRun + 1
              : state().requestsDuringRun,
          });
          try {
            sendFrame({
              payload: {
                event_type: "EventRequest",
                request_type: requestType,
                request: payload || {},
                request_id: requestId,
                response_topic: REPLY_TOPIC,
              },
            });
          } catch (err) {
            clearTimeout(timer);
            pending.delete(requestId);
            reject(err);
          }
        });
      }

      // The message pump. A client that reads until it finds its own reply, discarding the rest,
      // silently drops every notification. One handler serves the whole socket and dispatches
      // notifications while requests are still outstanding.
      function onMessage(event) {
        let frame;
        try {
          frame = JSON.parse(event.data);
        } catch {
          logFrame("in", {
            type: "unparseable",
            payload: { request_type: String(event.data).slice(0, 200) },
          });
          return;
        }
        logFrame("in", frame);
        const payload = frame.payload || {};

        if (frame.type === "pong") return;

        if (frame.type === "app_event" || payload.event_type === "AppEvent") {
          const payloadType = payload.payload_type || "";
          // Other libraries and the engine broadcast on this topic too.
          if (payloadType.indexOf("Nuke") === 0) {
            dispatchNotification(payloadType, payload.payload || {});
          }
          return;
        }

        const waiting = pending.get(payload.request_id);
        if (waiting) {
          clearTimeout(waiting.timer);
          pending.delete(payload.request_id);
          waiting.resolve(payload);
          return;
        }
        // Anything else is the engine's own traffic. Binding to it would take on the engine's
        // release cadence, which is the problem this protocol exists to avoid.
      }

      let drainWaiter = null;

      function dispatchNotification(payloadType, body) {
        const patch = {
          notifications: state().notifications.concat([
            { type: payloadType, body },
          ]),
        };

        if (payloadType === NOTIFICATION.NODE_STATE) {
          const nodeStates = state().nodeStates.slice();
          const index = nodeStates.findIndex(
            (entry) => entry.node === body.node_name,
          );
          const entry = {
            node: body.node_name,
            state: body.state,
            detail: body.detail || "",
          };
          if (index === -1) nodeStates.push(entry);
          else nodeStates[index] = entry;
          patch.nodeStates = nodeStates;
        } else if (payloadType === NOTIFICATION.PARAMETER_VALUE) {
          patch.outputValues = Object.assign({}, state().outputValues);
          patch.outputValues[portKey(body.node_name, body.parameter_name)] = {
            value: body.value,
            live: true,
          };
        } else if (payloadType === NOTIFICATION.EXECUTION_STATE) {
          patch.execution = body;
          if (TERMINAL_EXECUTION_STATES.indexOf(body.state) !== -1) {
            patch.runActive = false;
          }
        }

        setState(patch);
        noteEvent(payloadType, body);

        if (
          drainWaiter &&
          payloadType === NOTIFICATION.EXECUTION_STATE &&
          TERMINAL_EXECUTION_STATES.indexOf(body.state) !== -1
        ) {
          // A grace period, because trailing parameter values follow the terminal state.
          setTimeout(() => {
            if (drainWaiter) drainWaiter();
          }, DRAIN_GRACE_MS);
        }
        // An unknown Nuke* notification is logged and ignored rather than treated as fatal.
      }

      function drain(ms) {
        return new Promise((resolve) => {
          const finish = () => {
            clearTimeout(timer);
            drainWaiter = null;
            resolve();
          };
          const timer = setTimeout(finish, ms);
          drainWaiter = finish;
        });
      }

      function succeeded(reply) {
        return reply && reply.event_type === "EventResultSuccess";
      }

      // Failure messages are written to be shown to an artist, so they are used verbatim.
      function detailOf(reply) {
        const result = (reply && reply.result) || {};
        const details = result.result_details;
        if (details && Array.isArray(details.result_details)) {
          const messages = details.result_details.map(
            (entry) => (entry && entry.message) || JSON.stringify(entry),
          );
          if (messages.length) return messages.join("; ");
        }
        if (typeof details === "string") return details;
        return "";
      }

      function banner(kind, title, text) {
        setState({ banner: { kind, title, text } });
      }

      /* ------------------------------------------------------------- live push */
      //
      // A run this page did not start is the clearest proof that notifications are pushed.
      // Origin has to be inferred from whether this page sent the run request, because the
      // protocol carries no execution id to attribute an event with.

      function noteRunActivity(startedHere) {
        if (state().runActive) return;
        setState({
          runActive: true,
          runOrigin: startedHere ? "this page" : "elsewhere",
          runStartedAt: Date.now(),
          requestsDuringRun: 0,
        });
      }

      function noteEvent(payloadType, body) {
        const now = Date.now();
        const delta = state().lastEventAt ? now - state().lastEventAt : null;
        noteRunActivity(false);

        const feed = state().feed.concat([
          {
            delta,
            type: payloadType,
            summary: summarizeEvent(payloadType, body),
            foreign: state().runOrigin === "elsewhere",
            at: now,
          },
        ]);
        setState({
          lastEventAt: now,
          feed:
            feed.length > LIVE_FEED_LIMIT
              ? feed.slice(feed.length - LIVE_FEED_LIMIT)
              : feed,
        });
      }

      function summarizeEvent(payloadType, body) {
        if (payloadType === NOTIFICATION.NODE_STATE) {
          return (
            (body.state || "?") +
            "  " +
            (body.node_name || "?") +
            (body.detail ? "  " + body.detail : "")
          );
        }
        if (payloadType === NOTIFICATION.PARAMETER_VALUE) {
          return (
            ((body.value || {}).value_type || "?") +
            "  " +
            portKey(body.node_name, body.parameter_name)
          );
        }
        if (payloadType === NOTIFICATION.EXECUTION_STATE) {
          return (
            (body.state || "?") + "  terminal_node=" + (body.terminal_node || "-")
          );
        }
        return JSON.stringify(body).slice(0, 120);
      }

      /* --------------------------------------------------------------- connect */

      function openSocket(url) {
        return new Promise((resolve, reject) => {
          let socket;
          try {
            socket = new WebSocket(url);
          } catch (err) {
            reject(err);
            return;
          }
          socket.onopen = () => resolve(socket);
          socket.onerror = () =>
            reject(
              new Error(
                "Could not open " +
                  url +
                  ". Is the engine running with the websocket_direct driver enabled?",
              ),
            );
          socket.onclose = (event) => onSocketClosed(event);
          socket.onmessage = onMessage;
        });
      }

      function onSocketClosed(event) {
        const wasConnected = state().session !== null;
        ws = null;
        pending.forEach((entry) => clearTimeout(entry.timer));
        pending.clear();
        setState({
          socket:
            "disconnected" + (event && event.code ? " (" + event.code + ")" : ""),
          session: null,
          subscribed: { reply: false, events: false },
          runActive: false,
        });
        if (wasConnected) {
          banner(
            "warn",
            "Socket closed.",
            "Notifications sent while disconnected are gone. There is no buffer, backlog, or " +
              "resume cursor, so reconnecting cannot replay them. Reconnect, then read execution " +
              "state to get current truth instead of assuming continuity.",
          );
        }
      }

      async function doConnect() {
        setState({ socket: "connecting", banner: null });
        try {
          ws = await openSocket(state().wsUrl.trim());
        } catch (err) {
          setState({ socket: "failed" });
          banner("bad", "Connection failed.", err.message);
          return;
        }
        setState({ socket: "open" });

        // Subscribe before the first request, or the reply has nowhere to be published.
        subscribe(REPLY_TOPIC);
        setState({ subscribed: { reply: true, events: false } });

        let reply;
        try {
          reply = await request(
            VERB.CONNECT,
            {
              client_protocol_versions: CLIENT_PROTOCOL_VERSIONS,
              client_name: state().clientName.trim() || "browser host",
            },
            CONNECT_TIMEOUT_MS,
          );
        } catch (err) {
          // No reply is a different diagnosis from a refusal. The engine drops a request type it
          // has no handler for without answering, so silence means the verb's owner is missing.
          setState({ socket: "no reply" });
          banner(
            "bad",
            "Connected to the socket, but the connect verb was never answered.",
            err.message +
              ". The socket is open and the engine is reachable, so the likely cause is that " +
              "this library is not installed in this engine: the engine answers a request type " +
              "it has no handler for with silence rather than a failure. Confirm the library is " +
              "registered, and that it loaded in the orchestrator process rather than a worker.",
          );
          return;
        }

        if (!succeeded(reply)) {
          const supported =
            (reply.result && reply.result.supported_protocol_versions) || [];
          setState({ socket: "refused" });
          banner(
            "bad",
            "The library refused this protocol version.",
            detailOf(reply) + " Library supports: " + JSON.stringify(supported),
          );
          return;
        }

        const result = reply.result || {};
        // protocol_version is the highest version both sides know. engine_version is display only.
        setState({ socket: "connected", session: result, banner: null });

        // The event topic is not derivable. Miss this and you get replies but silently no
        // notifications, which looks like a working integration with no progress reporting.
        if (result.event_topic) {
          subscribe(result.event_topic);
          setState({ subscribed: { reply: true, events: true } });
        }

        await doList();
      }

      function doDisconnect() {
        if (ws) ws.close(1000, "host closing");
      }

      /* --------------------------------------------------------------- actions */

      async function doList() {
        const reply = await request(VERB.LIST_WORKFLOWS, {
          runnable_only: state().runnableOnly,
        });
        if (!succeeded(reply)) {
          banner("bad", "Listing failed.", detailOf(reply));
          return;
        }
        setState({ workflows: (reply.result && reply.result.workflows) || [] });
      }

      async function doDescribe(workflowId) {
        const reply = await request(VERB.DESCRIBE_WORKFLOW, {
          workflow_id: workflowId,
        });
        if (!succeeded(reply)) {
          setState({ described: null });
          banner("bad", "Describe failed.", detailOf(reply));
          return;
        }
        const described = reply.result || {};
        setState({
          described,
          knobs: {},
          outputValues: {},
          banner: null,
          conformanceWorkflowId:
            state().conformanceWorkflowId || described.workflow_id,
        });
      }

      // Inputs are addressed as {node: {parameter: value}}, using the node and parameter describe
      // reported. Knob values live in state, so this reads state rather than scraping the DOM.
      function collectInputs() {
        const inputs = {};
        (state().described.inputs || []).forEach((port) => {
          const raw = state().knobs[portKey(port.node, port.parameter)];
          if (raw === undefined || raw === "") return;
          let value = raw;
          if (port.type === "GTNumber") {
            value = Number(raw);
            if (Number.isNaN(value)) return;
          }
          if (!inputs[port.node]) inputs[port.node] = {};
          inputs[port.node][port.parameter] = value;
        });
        return inputs;
      }

      async function doRun() {
        if (!state().described) return;
        setState({
          nodeStates: [],
          outputValues: {},
          execution: null,
          runActive: false,
        });
        noteRunActivity(true);

        const reply = await request(VERB.EXECUTE_WORKFLOW, {
          workflow_id: state().described.workflow_id,
          inputs: collectInputs(),
        });
        setState({ lastRun: reply.result || {} });

        if (!succeeded(reply)) {
          banner("bad", "Run refused.", detailOf(reply));
          return;
        }

        const applied = (reply.result && reply.result.applied_inputs) || [];
        const rejected = (reply.result && reply.result.rejected_inputs) || [];
        if (rejected.length) {
          // The worst failure mode in the protocol: the run succeeds and produces plausible
          // output computed from values the artist did not set.
          banner(
            "bad",
            rejected.length + " input(s) were rejected.",
            rejected
              .map((port) => portKey(port.node, port.parameter))
              .join(", ") +
              ". The workflow still ran, using whatever values were already on those " +
              "parameters, so its output looks plausible but was computed from the wrong input.",
          );
        } else {
          banner(
            "info",
            "Running.",
            "state: " +
              ((reply.result && reply.result.state) || "?") +
              ", " +
              applied.length +
              " input(s) applied, none rejected.",
          );
        }
      }

      async function doCancel() {
        const reply = await request(VERB.CANCEL_EXECUTION, {});
        if (succeeded(reply)) {
          // The reply is not confirmation that execution stopped. The terminal state arrives as
          // a notification with state "cancelled".
          banner(
            "warn",
            "Cancel accepted.",
            "Not confirmation that execution stopped. Wait for the terminal notification.",
          );
        } else {
          banner("warn", "Cancel refused.", detailOf(reply));
        }
      }

      async function doReadState() {
        const reply = await request(VERB.GET_EXECUTION_STATE, {
          include_outputs: true,
        });
        if (!succeeded(reply)) {
          setState({ pollSummary: "read failed: " + detailOf(reply) });
          return;
        }
        const result = reply.result || {};
        const outputValues = Object.assign({}, state().outputValues);
        const outputs = result.outputs || {};
        Object.keys(outputs).forEach((node) => {
          const parameters = outputs[node] || {};
          Object.keys(parameters).forEach((parameter) => {
            outputValues[portKey(node, parameter)] = {
              value: parameters[parameter],
              live: false,
            };
          });
        });
        setState({
          outputValues,
          pollSummary:
            "running: " +
            result.running +
            ", active: " +
            JSON.stringify(result.active_nodes || []) +
            ", involved: " +
            (result.involved_nodes || []).length,
        });
      }

      function guard(fn) {
        return async () => {
          try {
            await fn();
          } catch (err) {
            banner(
              "bad",
              "Request failed.",
              String(err && err.message ? err.message : err),
            );
          }
        };
      }

      /* ------------------------------------------------------------ conformance */

      function reportCheck(label, passed, meta, extra) {
        setState({
          checks: state().checks.concat([{ label, passed, meta, extra }]),
        });
        return passed;
      }

      function reportReply(label, reply, expectFailure) {
        const passed = succeeded(reply) !== Boolean(expectFailure);
        const noise = [
          "result_type",
          "result_details",
          "altered_workflow_state",
          "exception",
          "traceback",
        ];
        const body = reply.result || {};
        const visible = {};
        Object.keys(body).forEach((key) => {
          if (noise.indexOf(key) === -1) visible[key] = body[key];
        });
        return reportCheck(
          label,
          passed,
          "result_type: " +
            (reply.result_type || "?") +
            "  |  " +
            detailOf(reply).slice(0, 200),
          Object.keys(visible).length
            ? JSON.stringify(visible).slice(0, 400)
            : "",
        );
      }

      async function runConformance() {
        setState({ conformanceRunning: true, checks: [] });

        try {
          // 1 and 2: negotiation, in both directions.
          const connected = await request(VERB.CONNECT, {
            client_protocol_versions: CLIENT_PROTOCOL_VERSIONS,
            client_name: "conformance",
          });
          reportReply(
            "connect: negotiate protocol and receive the event topic",
            connected,
          );
          const valueTypes = (connected.result && connected.result.value_types) || [];

          reportReply(
            "connect: unsupported protocol version is refused",
            await request(VERB.CONNECT, { client_protocol_versions: [99] }),
            true,
          );

          // 3 to 5: discovery.
          reportReply(
            "discover: list runnable workflows",
            await request(VERB.LIST_WORKFLOWS, { runnable_only: true }),
          );

          const chosenId = state().conformanceWorkflowId;
          let described = null;
          if (chosenId) {
            const reply = await request(VERB.DESCRIBE_WORKFLOW, {
              workflow_id: chosenId,
            });
            reportReply("discover: describe ports as host types", reply);
            if (succeeded(reply)) described = reply.result;
          } else {
            reportCheck(
              "discover: describe ports as host types",
              false,
              "no workflow chosen",
              "Choose the workflow to exercise in the dropdown above.",
            );
          }

          reportReply(
            "discover: unknown workflow id fails cleanly",
            await request(VERB.DESCRIBE_WORKFLOW, {
              workflow_id: "does-not-exist",
            }),
            true,
          );

          // 6 to 10: run and listen. Missing a target fails rather than skipping, because
          // silently dropping these leaves the page green with the run and listen paths untested.
          if (!described) {
            reportCheck(
              "run and listen: no workflow to execute",
              false,
              "5 checks could not run",
              "Either nothing runnable is registered, or no workflow was chosen. A runnable " +
                "workflow needs a Start Flow and End Flow pair and a file still on disk.",
            );
          } else {
            const inputs = {};
            (described.inputs || []).forEach((port) => {
              if (port.type !== "GTText") return;
              if (!inputs[port.node]) inputs[port.node] = {};
              inputs[port.node][port.parameter] = "nuke api smoke test";
            });

            const before = state().notifications.length;
            const started = await request(VERB.EXECUTE_WORKFLOW, {
              workflow_id: chosenId,
              inputs,
            });
            const runStarted = reportReply(
              "run: start a workflow with inputs",
              started,
            );

            if (runStarted) {
              // Not one request is sent during the drain, so a pass cannot be explained by polling.
              await drain(DRAIN_MS);
              const fresh = state().notifications.slice(before);
              const nodeEvents = fresh.filter(
                (n) => n.type === NOTIFICATION.NODE_STATE,
              );
              const valueEvents = fresh.filter(
                (n) => n.type === NOTIFICATION.PARAMETER_VALUE,
              );
              const executionEvents = fresh.filter(
                (n) => n.type === NOTIFICATION.EXECUTION_STATE,
              );

              reportCheck(
                "listen: node state events arrive unsolicited",
                nodeEvents.length > 0,
                nodeEvents.length + " received, no request was sent",
                nodeEvents
                  .slice(0, 5)
                  .map((n) => n.body.state + " " + n.body.node_name)
                  .join(" | "),
              );

              const escaped = valueEvents.filter(
                (n) =>
                  valueTypes.indexOf((n.body.value || {}).value_type) === -1,
              );
              reportCheck(
                "listen: parameter value events arrive normalized",
                valueEvents.length > 0 && escaped.length === 0,
                valueEvents.length +
                  " received, " +
                  escaped.length +
                  " outside the closed type set",
                escaped.length
                  ? "ESCAPED: " +
                      escaped
                        .map((n) => (n.body.value || {}).value_type)
                        .join(", ")
                  : valueEvents
                      .slice(0, 5)
                      .map(
                        (n) =>
                          (n.body.value || {}).value_type +
                          " " +
                          portKey(n.body.node_name, n.body.parameter_name),
                      )
                      .join(" | "),
              );

              reportCheck(
                "listen: terminal execution event",
                executionEvents.length > 0,
                executionEvents
                  .map(
                    (n) =>
                      n.body.state +
                      " terminal_node=" +
                      JSON.stringify(n.body.terminal_node),
                  )
                  .join(" | "),
              );

              // Recovery: what a host does after reconnecting having missed every event.
              const recovered = await request(VERB.GET_EXECUTION_STATE, {
                include_outputs: true,
              });
              const returned = Object.keys(
                (recovered.result && recovered.result.outputs) || {},
              );
              const promised = Array.from(
                new Set((described.outputs || []).map((port) => port.node)),
              );
              reportCheck(
                "recover: read declared outputs with no events",
                succeeded(recovered) &&
                  promised.every((node) => returned.indexOf(node) !== -1),
                "promised: " +
                  JSON.stringify(promised.sort()) +
                  "  returned: " +
                  JSON.stringify(returned.sort()),
                succeeded(recovered) ? "" : detailOf(recovered),
              );
            }
          }

          // 11: cancelling nothing is a failure, which is correct rather than a silent no-op.
          reportReply(
            "cancel: refused cleanly when nothing is running",
            await request(VERB.CANCEL_EXECUTION, {}),
            true,
          );

          // 12: additive change safety. A field from a future version must be ignored.
          reportReply(
            "compat: unknown request field is ignored",
            await request(VERB.CONNECT, {
              client_protocol_versions: CLIENT_PROTOCOL_VERSIONS,
              field_from_a_future_version: "ignore me",
            }),
          );
        } catch (err) {
          reportCheck(
            "conformance run aborted",
            false,
            String(err && err.message ? err.message : err),
          );
        }

        setState({ conformanceRunning: false });
      }

      /* ----------------------------------------------- value descriptor components */

      function Preview({ valueType, url }) {
        const [failed, setFailed] = useState(false);
        const tag = PREVIEWABLE[valueType];
        if (!tag || !url) return null;
        if (failed) {
          return html`<div class="muted">
            Preview failed. The engine can reach this URL; this browser cannot.
          </div>`;
        }
        // A URL the engine can reach is not necessarily one this browser can reach.
        if (tag === "video") {
          return html`<video src=${url} controls onError=${() => setFailed(true)}></video>`;
        }
        return html`<img src=${url} onError=${() => setFailed(true)} />`;
      }

      // What a real host does with a path: hand it to a Read node. is_pattern paths are correct
      // for a file knob and invalid for a direct open, so nothing here tries to load them.
      function ReadNodeRow({ source }) {
        return html`
          <div>
            <div class="stack">
              <span class="muted">Read1.file</span>
              <span class="path">${source.value || ""}</span>
              <button
                onClick=${() =>
                  navigator.clipboard &&
                  navigator.clipboard.writeText(source.value || "")}
              >
                Copy
              </button>
            </div>
            <div class="muted">
              ${source.is_pattern
                ? "Frame padding. Valid for a Read node's file knob, invalid for a direct file open."
                : "A local filesystem path. A browser cannot open it; Nuke feeds it straight to a Read node."}
            </div>
          </div>
        `;
      }

      function Source({ valueType, source }) {
        const kind = source.kind || "?";
        return html`
          <div class="src">
            <div class="stack">
              <span class="badge">${kind}</span>
              <!-- format is reported only when known, never guessed. -->
              <span class="muted">format: ${source.format || "unknown"}</span>
              ${source.width && source.height
                ? html`<span class="muted">${source.width}x${source.height}</span>`
                : null}
              ${source.byte_count
                ? html`<span class="muted">${source.byte_count} bytes</span>`
                : null}
              ${source.is_pattern
                ? html`<span class="badge warn">SEQUENCE ####</span>`
                : null}
            </div>

            ${kind === "url"
              ? html`
                  <a class="path" href=${source.value || "#"} target="_blank" rel="noreferrer">
                    ${source.value || ""}
                  </a>
                  ${source.is_pattern
                    ? null
                    : html`<${Preview} valueType=${valueType} url=${source.value} />`}
                `
              : null}
            ${kind === "path" ? html`<${ReadNodeRow} source=${source} />` : null}
            ${kind === "inline"
              ? html`<div class="muted">
                  Bytes stayed in the engine and are not in the payload. Read the same value in
                  its url or path form, or treat it as unavailable.
                </div>`
              : null}
            ${kind === "macro"
              ? html`
                  <!-- Not a path. Opening it turns a config error into a mysterious file error. -->
                  <span class="badge bad">UNRESOLVED MACRO</span>
                  <div class="path">${source.value || source.raw || ""}</div>
                  <div class="muted">
                    A template that never resolved, usually a workflow variable that was never
                    substituted. Show it as a configuration error. Do not open it.
                  </div>
                `
              : null}
            ${["url", "path", "inline", "macro"].indexOf(kind) === -1
              ? html`<div class="muted">
                  Unrecognized source kind, left alone. Raw: ${JSON.stringify(source.value)}
                </div>`
              : null}
            ${source.raw && source.raw !== source.value
              ? html`<div class="diag">raw: ${source.raw}</div>`
              : null}
          </div>
        `;
      }

      // Switches on value_type only. engine_type is diagnostic and must never be branched on.
      function ValueView({ descriptor }) {
        if (!descriptor || typeof descriptor !== "object") {
          return html`<div class="value"><span class="muted">no value</span></div>`;
        }
        const valueType = descriptor.value_type || "?";
        const sources = Array.isArray(descriptor.sources) ? descriptor.sources : [];
        const isScalar = SCALAR_TYPES.indexOf(valueType) !== -1;

        return html`
          <div class="value">
            <div class="head">
              <span class="vt">${valueType}</span>
              ${valueType === "GTImage" && sources.length > 1
                ? html`<span class="badge warn">SEQUENCE, ${sources.length} sources</span>`
                : null}
              ${!isScalar && sources.length === 0
                ? html`<span class="badge bad">no sources</span>`
                : null}
            </div>

            ${isScalar
              ? html`<div class="muted">
                  Scalar type. The descriptor carries the type only, not the value.
                </div>`
              : null}

            ${sources.map(
              (source) => html`<${Source} valueType=${valueType} source=${source || {}} />`,
            )}

            ${PREVIEWABLE[valueType]
              ? html`<div class="muted">
                  ${descriptor.colorspace
                    ? "colorspace: " + descriptor.colorspace
                    : "colorspace: unspecified. This page assumes scene-linear, and says so rather than assuming silently."}
                </div>`
              : null}

            <div class="diag">
              engine_type: ${descriptor.engine_type || "?"} (diagnostic only, never branch on this)
            </div>
          </div>
        `;
      }

      /* ------------------------------------------------------------- panel tab */

      function Workflows({ st }) {
        return html`
          <div class="pane">
            <h2>Workflows</h2>
            <div class="body">
              <div class="stack" style="margin-bottom: 8px">
                <label>
                  <input
                    type="checkbox"
                    checked=${st.runnableOnly}
                    onChange=${(e) => {
                      setState({ runnableOnly: e.target.checked });
                      if (st.session) guard(doList)();
                    }}
                  />
                  runnable only
                </label>
                <button disabled=${!st.session} onClick=${guard(doList)}>Refresh</button>
              </div>
              ${!st.workflows.length
                ? html`<div class="empty">
                    ${st.session
                      ? "No workflows returned. Register one with a Start Flow and End Flow pair."
                      : "Connect to list workflows."}
                  </div>`
                : st.workflows.map(
                    (workflow) => html`
                      <div
                        class=${"item" +
                        (st.described && st.described.workflow_id === workflow.id ? " sel" : "")}
                        onClick=${() => guard(() => doDescribe(workflow.id))()}
                      >
                        <div class="stack">
                          <span class="name">${workflow.name || "(unnamed)"}</span>
                          <span class=${workflow.runnable ? "badge" : "badge bad"}>
                            ${workflow.runnable ? "runnable" : "unavailable"}
                          </span>
                        </div>
                        ${!workflow.runnable && workflow.unavailable_reason
                          ? html`<div class="sub">${workflow.unavailable_reason}</div>`
                          : null}
                        <!-- The id is an opaque key: used for calls, never parsed. -->
                        <div class="sub">${workflow.id}</div>
                      </div>
                    `,
                  )}
            </div>
          </div>
        `;
      }

      // One knob per declared input port, with the widget chosen from the port's host type.
      // That is the point of describe: the panel is generated, not hand-written per workflow.
      function Knob({ port, value }) {
        const key = portKey(port.node, port.parameter);
        const set = (v) =>
          setState({ knobs: Object.assign({}, state().knobs, { [key]: v }) });
        const isFile = ["GTImage", "GTVideo", "GTFile"].indexOf(port.type) !== -1;

        let widget;
        if (port.type === "GTBoolean") {
          widget = html`<input
            type="checkbox"
            checked=${value === true}
            onChange=${(e) => set(e.target.checked)}
          />`;
        } else if (port.type === "GTNumber") {
          widget = html`<input
            type="number"
            step="any"
            value=${value === undefined ? "" : value}
            onInput=${(e) => set(e.target.value)}
          />`;
        } else if (port.type === "GTNull") {
          widget = html`<input type="text" disabled placeholder="declared GTNull, nothing to send" />`;
        } else {
          widget = html`<input
            type="text"
            placeholder=${isFile ? "/path/to/plate.####.exr" : ""}
            value=${value === undefined ? "" : value}
            onInput=${(e) => set(e.target.value)}
          />`;
        }

        return html`
          <div class=${"knob" + (isFile ? " file" : "")}>
            <label>${port.name || key}</label>
            <div class="widget">${widget}</div>
            <span class="type">${port.type || "?"}</span>
            ${KNOWN_VALUE_TYPES.indexOf(port.type) === -1
              ? html`<span class="muted">unrecognized type, sent as text</span>`
              : null}
          </div>
        `;
      }

      function Properties({ st }) {
        const described = st.described;
        return html`
          <div class="pane">
            <h2>Properties</h2>
            <div class="body">
              ${!described
                ? html`<div class="empty">Select a workflow.</div>`
                : html`
                    <div class="name">${described.name || "(unnamed)"}</div>
                    ${described.description
                      ? html`<div class="muted">${described.description}</div>`
                      : null}
                    ${!(described.inputs || []).length
                      ? html`<div class="empty">This workflow declares no inputs.</div>`
                      : (described.inputs || []).map(
                          (port) => html`
                            <${Knob}
                              port=${port}
                              value=${st.knobs[portKey(port.node, port.parameter)]}
                            />
                          `,
                        )}
                  `}
              ${described
                ? html`<div class="stack" style="margin-top: 10px">
                    <button class="primary" onClick=${guard(doRun)}>Execute</button>
                    <button onClick=${guard(doCancel)}>Cancel</button>
                  </div>`
                : null}
            </div>
          </div>
        `;
      }

      function Execution({ st }) {
        const declared = (st.described && st.described.outputs) || [];
        return html`
          <div class="pane">
            <h2>Execution</h2>
            <div class="body">
              ${!st.execution
                ? html`<div class="empty">Nothing has run on this connection.</div>`
                : html`
                    <div class="stack">
                      <span
                        class=${"chip " +
                        stateClass(st.execution.state, TERMINAL_EXECUTION_STATES.concat(["running"]))}
                      >
                        ${st.execution.state || "?"}
                      </span>
                      <span class="muted">terminal_node: ${st.execution.terminal_node || "-"}</span>
                    </div>
                    ${st.execution.detail ? html`<div>${st.execution.detail}</div>` : null}
                  `}

              <p class="note">
                The terminal notification carries no outputs on purpose, and its
                <code>terminal_node</code> is whichever node control flow ended on, which is often
                not a declared output node. Outputs mean the ports describe declared, below.
              </p>

              <h3 class="subhead">Nodes</h3>
              ${!st.nodeStates.length
                ? html`<div class="empty">No node state events yet.</div>`
                : st.nodeStates.map(
                    (entry) => html`
                      <div class="row">
                        <div class="stack">
                          <span class=${"chip " + stateClass(entry.state, KNOWN_NODE_STATES)}>
                            ${entry.state || "?"}
                          </span>
                          <span>${entry.node}</span>
                        </div>
                        ${entry.detail ? html`<div class="muted">${entry.detail}</div>` : null}
                      </div>
                    `,
                  )}

              <h3 class="subhead">Declared outputs</h3>
              <div class="stack" style="margin-bottom: 6px">
                <button disabled=${!st.session} onClick=${guard(doReadState)}>
                  Read outputs from engine
                </button>
                <span class="muted">${st.pollSummary}</span>
              </div>
              ${!declared.length
                ? html`<div class="empty">Select a workflow to see its declared output ports.</div>`
                : declared.map((port) => {
                    const entry = st.outputValues[portKey(port.node, port.parameter)];
                    return html`
                      <div class="row">
                        <div class="stack">
                          <span>${port.name || portKey(port.node, port.parameter)}</span>
                          <span class="badge">${port.type || "?"}</span>
                          ${entry
                            ? html`<span class="muted">
                                ${entry.live ? "from notification" : "read from engine"}
                              </span>`
                            : null}
                        </div>
                        ${entry
                          ? html`<${ValueView} descriptor=${entry.value} />`
                          : html`<div class="empty">no value yet</div>`}
                      </div>
                    `;
                  })}
            </div>
          </div>
        `;
      }

      /* --------------------------------------------------------------- live tab */

      function Stat({ label, value, accent }) {
        return html`
          <div class="stat">
            <div class="k">${label}</div>
            <div class=${"v" + (accent ? " " + accent : "")}>${value}</div>
          </div>
        `;
      }

      // Prefixed to stay clear of the .value class the descriptor renderer already owns.
      function typeClass(payloadType) {
        if (payloadType === NOTIFICATION.NODE_STATE) return "ev-node";
        if (payloadType === NOTIFICATION.PARAMETER_VALUE) return "ev-value";
        if (payloadType === NOTIFICATION.EXECUTION_STATE) return "ev-exec";
        return "";
      }

      function LiveTab({ st }) {
        const now = Date.now();
        const streaming = st.lastEventAt && now - st.lastEventAt < 2000;
        const recent = st.feed.filter((entry) => now - entry.at < 3000);
        const resolved = st.nodeStates.filter((e) => e.state === "resolved").length;
        const elapsed = !st.runStartedAt
          ? "-"
          : (((st.runActive ? now : st.lastEventAt || now) - st.runStartedAt) / 1000).toFixed(1) + "s";

        return html`
          <div>
            <div class="banner info">
              <b>Nothing on this tab was requested.</b>
              Every row below arrived unsolicited on the event topic. The request counter is the
              proof: it stops moving while the feed fills. A run started anywhere, including the
              editor or another host, appears here, because the engine fans out to every
              subscribed connection rather than answering a poll.
            </div>
            <div class="stats">
              <${Stat}
                label="stream"
                value=${!st.session ? "offline" : streaming ? "receiving" : "listening"}
                accent=${streaming ? "hot pulse" : "cold"}
              />
              <${Stat} label="events received" value=${st.notifications.length} />
              <${Stat} label="events/sec" value=${(recent.length / 3).toFixed(1)} />
              <${Stat} label="requests sent, total" value=${st.requestsSent} />
              <!-- Zero requests against a live run is the whole claim, so it gets the accent. -->
              <${Stat}
                label="requests during this run"
                value=${st.requestsDuringRun}
                accent=${st.runOrigin && st.requestsDuringRun === 0 ? "hot" : ""}
              />
              <${Stat} label="run started by" value=${st.runOrigin || "-"} />
              <${Stat} label="elapsed" value=${elapsed} />
              <${Stat}
                label="nodes resolved"
                value=${st.nodeStates.length ? resolved + " / " + st.nodeStates.length : "-"}
              />
            </div>
            <p class="note">
              "elsewhere" is inferred, not reported. The protocol carries no execution id, so this
              page knows only that it sent no run request while these events arrived. Nothing in
              the payloads says whose run this is, which is the same gap that makes cancel apply
              to whatever happens to be running.
            </p>
            <div class="stack" style="margin-bottom: 6px">
              <button onClick=${() => setState({ feed: [] })}>Clear feed</button>
              <span class="muted">newest first, capped at ${LIVE_FEED_LIMIT}</span>
            </div>
            <div class="feed">
              ${!st.feed.length
                ? html`<div class="empty">
                    Nothing yet. Connect, then start a workflow here or from the editor.
                  </div>`
                : st.feed
                    .slice()
                    .reverse()
                    .map(
                      (entry) => html`
                        <div class=${"ev" + (entry.foreign ? " foreign" : "")}>
                          <span class="dt">
                            ${entry.delta === null ? "" : "+" + entry.delta + "ms"}
                          </span>
                          <span class=${"ty " + typeClass(entry.type)}>${entry.type}</span>
                          <span class="su">${entry.summary}</span>
                        </div>
                      `,
                    )}
            </div>
          </div>
        `;
      }

      /* -------------------------------------------------------- conformance tab */

      function ConformanceTab({ st }) {
        const passed = st.checks.filter((c) => c.passed).length;
        const runnable = st.workflows.filter((w) => w.runnable);
        return html`
          <div>
            <div class="stack" style="margin-bottom: 10px">
              <button
                class="primary"
                disabled=${!st.session || st.conformanceRunning}
                onClick=${runConformance}
              >
                ${st.conformanceRunning ? "Running..." : "Run all checks"}
              </button>
              <label for="exercise" class="muted">exercise</label>
              <select
                id="exercise"
                value=${st.conformanceWorkflowId}
                onChange=${(e) => setState({ conformanceWorkflowId: e.target.value })}
              >
                <option value="">
                  ${runnable.length ? "select a workflow" : "no runnable workflows"}
                </option>
                ${runnable.map(
                  (workflow) => html`
                    <option value=${workflow.id}>${workflow.name || workflow.id}</option>
                  `,
                )}
              </select>
              <span class="muted">Mirrors the checks in scripts/nuke_host_client.py.</span>
            </div>
            <div class="banner warn">
              <b>This executes the chosen workflow for real.</b>
              Pick one that is cheap to run. The target is chosen explicitly rather than defaulting
              to whichever workflow is listed first, because the first entry is as likely to be a
              generative workflow that costs money and minutes as it is to be a smoke test.
            </div>
            ${st.checks.length
              ? html`<div class="score">${passed}/${st.checks.length} checks passed</div>`
              : null}
            ${st.checks.map(
              (check) => html`
                <div class=${"check " + (check.passed ? "pass" : "fail")}>
                  <div class="label">${(check.passed ? "PASS  " : "FAIL  ") + check.label}</div>
                  ${check.meta ? html`<div class="meta">${check.meta}</div>` : null}
                  ${check.extra ? html`<div class="muted">${check.extra}</div>` : null}
                </div>
              `,
            )}
          </div>
        `;
      }

      /* ------------------------------------------------------------- frames tab */

      function Frame({ entry }) {
        const [open, setOpen] = useState(false);
        return html`
          <div>
            <div class="frame" onClick=${() => setOpen(!open)}>
              <span class=${"dir " + entry.direction}>
                ${entry.direction === "out" ? "\u2192" : "\u2190"}
              </span>
              <span class="ts">${entry.at.toISOString().slice(11, 23)}</span>
              <span class="kind">${entry.type}</span>
              <span class="what">${entry.what}</span>
              <span class="rid">${entry.requestId ? entry.requestId.slice(0, 8) : ""}</span>
            </div>
            ${open
              ? html`<pre class="json">${JSON.stringify(entry.frame, null, 2)}</pre>`
              : null}
          </div>
        `;
      }

      function FramesTab({ st }) {
        const filter = st.frameFilter.trim().toLowerCase();
        const visible = useMemo(
          () =>
            st.frames.filter((entry) =>
              filter
                ? (entry.type + " " + entry.what + " " + entry.requestId)
                    .toLowerCase()
                    .indexOf(filter) !== -1
                : true,
            ),
          [st.frames, filter],
        );

        return html`
          <div>
            <div class="stack" style="margin-bottom: 10px">
              <label for="frameFilter" class="muted">filter</label>
              <input
                id="frameFilter"
                type="text"
                size="30"
                placeholder="type, request_type, payload_type, id"
                value=${st.frameFilter}
                onInput=${(e) => setState({ frameFilter: e.target.value })}
              />
              <button onClick=${() => setState({ frames: [] })}>Clear</button>
              <span class="muted">
                ${visible.length} of ${st.frames.length} frames (capped at ${FRAME_LOG_LIMIT})
              </span>
            </div>
            ${!visible.length
              ? html`<div class="empty">No frames match.</div>`
              : visible
                  .slice()
                  .reverse()
                  .map((entry, i) => html`<${Frame} key=${entry.at.getTime() + "-" + i} entry=${entry} />`)}
          </div>
        `;
      }

      /* ------------------------------------------------------------------ shell */

      const TABS = [
        ["panel", "Panel"],
        ["live", "Live push"],
        ["conformance", "Conformance"],
        ["frames", "Frames"],
      ];

      function TopBar({ st }) {
        const connected = Boolean(st.session);
        return html`
          <div class="topbar">
            <span class="title">GRIPTAPE / NUKE HOST</span>
            <label for="wsUrl">ws</label>
            <input
              id="wsUrl"
              type="text"
              size="24"
              value=${st.wsUrl}
              onInput=${(e) => setState({ wsUrl: e.target.value })}
            />
            <label for="clientName">client</label>
            <input
              id="clientName"
              type="text"
              size="22"
              value=${st.clientName}
              onInput=${(e) => setState({ clientName: e.target.value })}
            />
            <button class="primary" disabled=${connected} onClick=${guard(doConnect)}>
              Connect
            </button>
            <button disabled=${!connected} onClick=${doDisconnect}>Disconnect</button>
          </div>
        `;
      }

      function StatusStrip({ st }) {
        const session = st.session || {};
        const dot = (on) => "dot " + (on ? "on" : "off");
        return html`
          <div class="status">
            <span>
              <span class=${dot(st.socket === "connected")}></span>
              <span>${st.socket}</span>
            </span>
            <span>protocol <b>${session.protocol_version || "-"}</b></span>
            <span>engine <b>${session.engine_version || "-"}</b></span>
            <span>library <b>${session.library_version || "-"}</b></span>
            <span><span class=${dot(st.subscribed.reply)}></span>reply topic</span>
            <span>
              <span class=${dot(st.subscribed.events)}></span>
              event topic <b>${session.event_topic || "-"}</b>
            </span>
            <span>notifications <b>${st.notifications.length}</b></span>
          </div>
        `;
      }

      function App() {
        const st = useStore();

        // Keeps elapsed time and the event rate moving between events, so a stalled stream looks
        // stalled rather than slow. Only runs while the tab that shows them is open.
        useEffect(() => {
          if (st.tab !== "live") return undefined;
          const id = setInterval(() => setState({ tick: state().tick + 1 }), 500);
          return () => clearInterval(id);
        }, [st.tab]);

        return html`
          <div>
            <${TopBar} st=${st} />
            <${StatusStrip} st=${st} />
            <!-- Global rather than inside a tab, so a connect failure is visible from anywhere. -->
            ${st.banner
              ? html`<div class=${"banner " + st.banner.kind} style="margin: 10px 12px 0">
                  <b>${st.banner.title}</b>
                  <div>${st.banner.text}</div>
                </div>`
              : null}
            <div class="tabs">
              ${TABS.map(
                ([id, label]) => html`
                  <button
                    class=${st.tab === id ? "active" : ""}
                    onClick=${() => setState({ tab: id })}
                  >
                    ${label}
                  </button>
                `,
              )}
            </div>
            <div class="tab active">
              ${st.tab === "panel"
                ? html`<div class="cols">
                    <${Workflows} st=${st} />
                    <${Properties} st=${st} />
                    <${Execution} st=${st} />
                  </div>`
                : null}
              ${st.tab === "live" ? html`<${LiveTab} st=${st} />` : null}
              ${st.tab === "conformance" ? html`<${ConformanceTab} st=${st} />` : null}
              ${st.tab === "frames" ? html`<${FramesTab} st=${st} />` : null}
            </div>
          </div>
        `;
      }

      const root = document.getElementById("app");
      clearTimeout(window.__bootTimer);
      root.dataset.rendered = "1";
      root.innerHTML = "";
      render(html`<${App} />`, root);
    </script>
  </body>
</html>
