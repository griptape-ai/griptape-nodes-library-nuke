<!doctype html>
<!-- Plain scripts must load in dependency order; file:// pages cannot import sibling ES modules. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Griptape host panel</title>
    <link rel="stylesheet" href="./panel.css" />
  </head>
  <body>
    <div id="app" class="booting">Loading...</div>
    <script>
      window.__bootTimer = setTimeout(function () {
        var root = document.getElementById("app");
        if (!root || root.dataset.rendered) return;
        root.innerHTML =
          '<div class="bootfail"><b>The panel did not start.</b>' +
          "<p>Preact or htm may have failed to load from unpkg.com. Check network access and the " +
          "browser console, or use local copies.</p></div>";
      }, 8000);
    </script>

    <script src="https://unpkg.com/preact@10.23.1/dist/preact.umd.js"></script>
    <script src="https://unpkg.com/preact@10.23.1/hooks/dist/hooks.umd.js"></script>
    <script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>

    <script src="./protocol.js"></script>
    <script src="./config.js"></script>
    <script src="./store.js"></script>
    <script src="./values.js"></script>
    <script src="./transport.js"></script>
    <script src="./events.js"></script>
    <script src="./actions.js"></script>
    <script src="./session.js"></script>

    <script src="./ui/common.js"></script>
    <script src="./ui/project.js"></script>
    <script src="./ui/workflow.js"></script>
    <script src="./ui/parameters.js"></script>
    <script src="./ui/run.js"></script>
    <script src="./ui/outputs.js"></script>
    <script src="./ui/drawer.js"></script>
    <script src="./ui/app.js"></script>

    <script src="./main.js"></script>
  </body>
</html>
