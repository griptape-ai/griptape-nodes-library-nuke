[project]
name = "griptape-nodes-library-nuke"
version = "0.1.0"
description = "Griptape Nodes library for Foundry Nuke integration"
authors = [{ name = "Dan Hutchinson", email = "dan.hutchinson@foundry.com" }]
readme = "README.md"
requires-python = "~=3.12.0"
dependencies = [
    # The engine ships the griptape_nodes package this library imports; the
    # griptape-nodes distribution only ships the app. 0.99.0 is the release that
    # bundles static files referenced by a macro path, and no griptape-nodes
    # release floors the engine that high, so the floor has to be declared here.
    "griptape-nodes-engine>=0.99.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nuke_nodes", "execution", "script_parser", "nuke_runner"]

[dependency-groups]
dev = ["pyright>=1.1.396", "pytest-asyncio>=0.21.0", "ruff>=0.8.0", "pytest"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # Pyflakes
  "I",  # isort
  "B",  # flake8-bugbear
  "C4", # flake8-comprehensions
  "UP", # pyupgrade
]
ignore = [
  "E501", # line too long (handled by formatter)
  "B008", # do not perform function calls in argument defaults
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["."]
# publish_gizmo/ is not an installable package but output_protocol is imported from tests.
extraPaths = ["publish_gizmo"]
# run_button.py is exec'd inside Nuke's Python interpreter where `nuke` and `_config`
# are injected into the global scope at runtime. It is not a regular importable module.
exclude = [".venv", "**/node_modules", "**/__pycache__", "**/.*", "templates", "workflows", "publish_gizmo/run_button.py", "scripts/generate_test_fixtures.py", "nuke_runner/runner.py", "nuke_runner/baker.py", "nuke_runner/introspect.py", "nuke_runner/exporter.py"]
pythonVersion = "3.12"
reportIncompatibleMethodOverride = false
